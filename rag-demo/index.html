<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖知识库 · RAG 检索演示</title>
<style>
:root{
  --bg-deep:oklch(11% 0.01 30);
  --bg-surface:oklch(15% 0.012 30);
  --bg-elevated:oklch(20% 0.015 30);
  --bg-card:oklch(18% 0.012 30);
  --text-primary:oklch(94% 0.005 80);
  --text-secondary:oklch(78% 0.006 80);
  --text-muted:oklch(52% 0.008 70);
  --gold:#f4c15a;--jade:#34d399;--crimson:#f87171;
  --amber:#fbbf24;--purple:#a78bfa;--azurite:#38bdf8;
  --jade-dim:oklch(55% 0.15 145/0.15);
  --gold-dim:oklch(55% 0.15 85/0.15);
  --purple-dim:oklch(55% 0.15 300/0.15);
  --azurite-dim:oklch(55% 0.15 230/0.15);
  --crimson-dim:oklch(55% 0.15 25/0.15);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 8px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --mono:'JetBrains Mono','Cascadia Code','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden}

/* 全局噪点 */
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* 顶部 */
#top-bar{position:sticky;top:0;z-index:100;padding:12px 24px;background:oklch(11% 0.01 30/0.9);backdrop-filter:blur(12px);border-bottom:1px solid oklch(25% 0.012 30/0.5);display:flex;align-items:center;gap:16px}
#top-bar h1{font-size:16px;font-weight:700;letter-spacing:.08em;background:linear-gradient(90deg,var(--gold),var(--jade));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#top-bar .subtitle{font-size:11px;color:var(--text-muted);letter-spacing:.05em}
#kb-stats{margin-left:auto;display:flex;gap:12px;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
#kb-stats span{padding:2px 8px;background:var(--bg-card);border-radius:4px}

/* 主体布局 */
#main{display:grid;grid-template-columns:1fr 380px;gap:0;min-height:calc(100vh - 52px)}
#left-panel{padding:20px;overflow-y:auto;max-height:calc(100vh - 52px)}
#right-panel{border-left:1px solid oklch(25% 0.012 30/0.5);padding:16px;overflow-y:auto;max-height:calc(100vh - 52px);background:var(--bg-surface)}

/* 检索区 */
.search-section{margin-bottom:20px}
.search-section h2{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;letter-spacing:.06em}
#search-input{width:100%;padding:10px 14px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
#search-input:focus{border-color:var(--jade);box-shadow:0 0 12px var(--jade-dim)}
#search-input::placeholder{color:var(--text-muted)}
.search-actions{display:flex;gap:8px;margin-top:10px}
#search-btn{padding:8px 20px;background:linear-gradient(135deg,var(--jade),var(--azurite));color:oklch(8% 0.01 145);border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
#search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--jade-dim)}
#search-btn:active{transform:scale(.96)}
#compare-toggle{padding:8px 16px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .2s}
#compare-toggle:hover{border-color:var(--gold);color:var(--gold)}
#compare-toggle.active{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}

/* NPC 选择 */
.npc-selector{margin-bottom:20px;padding:12px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4)}
.npc-selector h3{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.npc-options{display:flex;gap:8px;flex-wrap:wrap}
.npc-chip{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid oklch(25% 0.012 30/0.6);color:var(--text-secondary);transition:all .2s var(--ease);user-select:none}
.npc-chip:hover{border-color:var(--jade);color:var(--jade)}
.npc-chip.selected{background:var(--jade-dim);border-color:var(--jade);color:var(--jade);font-weight:600}
.npc-role{font-size:9px;opacity:.6;margin-left:4px}

/* 检索结果 */
#results-section{margin-bottom:20px}
#results-title{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
#results-list{display:flex;flex-direction:column;gap:10px}
.result-card{padding:14px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4);border-left:3px solid var(--gold);transition:all .25s var(--ease);animation:cardIn .4s var(--ease-bounce) both;cursor:default}
.result-card:nth-child(1){animation-delay:.05s}
.result-card:nth-child(2){animation-delay:.15s}
.result-card:nth-child(3){animation-delay:.25s}
.result-card:hover{transform:translateX(3px);border-left-color:var(--jade);box-shadow:var(--shadow)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-title{font-size:13px;font-weight:600;color:var(--gold)}
.result-score{font-size:10px;font-family:var(--mono);color:var(--jade);background:var(--jade-dim);padding:2px 8px;border-radius:4px}
.result-category{font-size:10px;color:var(--text-muted);margin-bottom:6px}
.result-content{font-size:12px;color:var(--text-secondary);line-height:1.6;opacity:.85}
.result-source{font-size:10px;color:var(--text-muted);margin-top:8px;font-family:var(--mono);opacity:.6}
.result-keywords{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.result-kw{font-size:9px;padding:1px 6px;background:var(--purple-dim);color:var(--purple);border-radius:3px;font-family:var(--mono)}

/* 空状态 */
.empty-state{text-align:center;padding:32px;color:var(--text-muted)}
.empty-state .eicon{font-size:36px;margin-bottom:8px;opacity:.5}
.empty-state .etext{font-size:13px;margin-bottom:4px}
.empty-state .ehint{font-size:10px;opacity:.5}

/* 对比区 */
#comparison-section{display:none;margin-bottom:20px}
#comparison-section.visible{display:block}
.comparison-container{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comparison-panel{padding:14px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4)}
.comparison-label{font-size:10px;font-weight:600;letter-spacing:.06em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid oklch(25% 0.012 30/0.4)}
.comparison-label.no-rag{color:var(--crimson)}
.comparison-label.with-rag{color:var(--jade)}
.comparison-content{font-size:12px;color:var(--text-secondary);line-height:1.6;min-height:40px}
.comparison-content.loading{color:var(--text-muted);font-style:italic}
.comparison-thinking{font-size:10px;color:var(--azurite);margin-top:6px;font-family:var(--mono)}

/* 右侧面板：对话 */
#chat-section h2{font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
#chat-section h2 .badge{font-size:9px;padding:1px 6px;background:var(--jade-dim);color:var(--jade);border-radius:3px;font-weight:500}
#chat-messages{flex:1;overflow-y:auto;max-height:400px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.chat-msg{animation:msgIn .3s var(--ease-bounce) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.chat-msg.user .chat-bubble{background:var(--bg-elevated);border:1px solid oklch(25% 0.012 30/0.5);align-self:flex-end;max-width:85%}
.chat-msg.agent .chat-bubble{background:var(--jade-dim);border:1px solid oklch(55% 0.15 145/0.25);align-self:flex-start;max-width:85%}
.chat-bubble{padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.6;color:var(--text-secondary)}
.chat-meta{font-size:9px;color:var(--text-muted);margin-top:4px;font-family:var(--mono)}
.chat-msg.user .chat-meta{text-align:right}
.chat-agent-avatar{font-size:16px}
.chat-rag-indicator{font-size:10px;color:var(--azurite);margin-top:4px}
.chat-rag-indicator::before{content:'📚 ';opacity:.7}

/* 对话输入 */
#chat-input-row{display:flex;gap:8px}
#chat-input{flex:1;padding:8px 12px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;outline:none;transition:border-color .2s}
#chat-input:focus{border-color:var(--jade);box-shadow:0 0 8px var(--jade-dim)}
#chat-input::placeholder{color:var(--text-muted)}
#chat-send-btn{padding:8px 14px;background:linear-gradient(135deg,var(--jade),var(--azurite));color:oklch(8% 0.01 145);border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0}
#chat-send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--jade-dim)}
#chat-send-btn:active{transform:scale(.95)}

/* 知识库浏览 */
#kb-section{margin-top:16px}
#kb-section h3{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.kb-list{display:flex;flex-direction:column;gap:6px}
.kb-item{padding:8px 10px;background:var(--bg-card);border-radius:var(--radius-xs);border:1px solid oklch(25% 0.012 30/0.3);transition:all .2s}
.kb-item:hover{border-color:var(--gold);background:var(--bg-elevated)}
.kb-item-title{font-size:11px;font-weight:600;color:var(--gold);margin-bottom:2px}
.kb-item-meta{font-size:9px;color:var(--text-muted)}
.kb-item-cat{display:inline-block;font-size:9px;padding:0 4px;background:var(--azurite-dim);color:var(--azurite);border-radius:3px;margin-left:4px}

/* 流程动画 */
.flow-container{display:flex;align-items:center;gap:6px;margin:12px 0;padding:10px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.3)}
.flow-step{flex:1;text-align:center;padding:6px 4px;border-radius:4px;font-size:9px;color:var(--text-muted);transition:all .3s var(--ease)}
.flow-step.active{background:var(--jade-dim);color:var(--jade);font-weight:600;animation:flowPulse 1s ease-in-out infinite}
.flow-step.done{background:var(--gold-dim);color:var(--gold)}
@keyframes flowPulse{0%,100%{opacity:.7}50%{opacity:1}}
.flow-arrow{color:var(--text-muted);font-size:10px;flex-shrink:0}

/* 响应式 */
@media(max-width:900px){
  #main{grid-template-columns:1fr}
  #right-panel{border-left:none;border-top:1px solid oklch(25% 0.012 30/0.5)}
  .comparison-container{grid-template-columns:1fr}
}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:oklch(30% 0.01 30/0.5);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:oklch(40% 0.01 30/0.6)}
</style>
</head>
<body>

<div id="top-bar">
  <h1>📚 江湖知识库</h1>
  <span class="subtitle">RAG 检索增强生成 · 武侠世界专属</span>
  <div id="kb-stats">
    <span>条目: <b id="stat-entries">0</b></span>
    <span>分类: <b id="stat-categories">0</b></span>
    <span>检索: <b id="stat-searches">0</b></span>
  </div>
</div>

<div id="main">
  <div id="left-panel">
    <!-- NPC 身份选择 -->
    <div class="npc-selector">
      <h3>当前 NPC 身份</h3>
      <div class="npc-options" id="npc-options"></div>
    </div>

    <!-- 检索区 -->
    <div class="search-section">
      <h2>🔍 知识库检索</h2>
      <input id="search-input" type="text" placeholder="输入问题，检索江湖知识...（如：太极拳怎么练、金创药配方、少林武功）">
      <div class="search-actions">
        <button id="search-btn" onclick="performSearch()">检索知识库</button>
        <button id="compare-toggle" onclick="toggleComparison()">对比 RAG 效果</button>
      </div>
      <div class="flow-container" id="flow-container" style="display:none">
        <div class="flow-step" id="flow-keywords">关键词</div>
        <span class="flow-arrow">→</span>
        <div class="flow-step" id="flow-retrieve">检索</div>
        <span class="flow-arrow">→</span>
        <div class="flow-step" id="flow-rank">排序</div>
        <span class="flow-arrow">→</span>
        <div class="flow-step" id="flow-inject">注入</div>
        <span class="flow-arrow">→</span>
        <div class="flow-step" id="flow-generate">生成</div>
        <span class="flow-arrow">→</span>
        <div class="flow-step" id="flow-guard">Guardrail</div>
      </div>
    </div>

    <!-- 检索结果 -->
    <div id="results-section">
      <div id="results-title">检索结果</div>
      <div id="results-list">
        <div class="empty-state">
          <div class="eicon">📚</div>
          <div class="etext">输入问题，检索知识库</div>
          <div class="ehint">支持武功、医道、江湖、地理、历史等主题</div>
        </div>
      </div>
    </div>

    <!-- 对比区 -->
    <div id="comparison-section">
      <div id="results-title">RAG 效果对比</div>
      <div class="comparison-container">
        <div class="comparison-panel">
          <div class="comparison-label no-rag">✖ 无 RAG（纯角色）</div>
          <div class="comparison-content loading" id="no-rag-content">点击对比查看</div>
        </div>
        <div class="comparison-panel">
          <div class="comparison-label with-rag">✔ 有 RAG（增强生成）</div>
          <div class="comparison-content loading" id="with-rag-content">点击对比查看</div>
          <div class="comparison-thinking" id="rag-thinking"></div>
        </div>
      </div>
    </div>

    <!-- 知识库浏览 -->
    <div id="kb-section">
      <h3>知识库条目（<span id="kb-count">0</span>）</h3>
      <div class="kb-list" id="kb-list"></div>
    </div>
  </div>

  <div id="right-panel">
    <div id="chat-section" style="display:flex;flex-direction:column;min-height:0">
      <h2>💬 NPC 对话 <span class="badge" id="chat-npc-badge">选择 NPC</span></h2>
      <div id="chat-messages">
        <div class="chat-msg agent" style="opacity:.6">
          <div class="chat-bubble">选择左侧 NPC 身份，输入问题即可开始对话。开启 RAG 对比可看到知识增强效果。</div>
        </div>
      </div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="向 NPC 提问..." onkeydown="if(event.key==='Enter')sendChat()">
        <button id="chat-send-btn" onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════ 知识库数据 ═══════════════ */
var KB = {
  entries: [
    {id:'k001',category:'武功',title:'太极拳',content:'太极拳乃武当派祖太极祖师张三丰所创，讲究以柔克刚，后发制人。练至深处可四两拨千斤，化解千军万马之势。拳法圆融无断，行云流水。',keywords:['太极','武当','张三丰','以柔克刚','拳法'],severity:85,source:'《武当武学谱》'},
    {id:'k002',category:'武功',title:'独孤九剑',content:'独孤九剑由剑魔独孤求败所创，共九式：破剑式、破刀式、破枪式、破鞭式、破索式、破掌式、破箭式、破气式。讲究以无招胜有招，天下无敌。',keywords:['独孤','剑法','无招','独孤求败','九剑'],severity:90,source:'《独孤剑谱》'},
    {id:'k003',category:'武功',title:'降龙十八掌',content:'降龙十八掌乃天下第一刚猛掌法，招式刚烈无匹。每一掌都蕴含龙之威势，掌风所及，山石俱碎。传自逍遥派，后归丐帮。',keywords:['降龙','掌法','刚猛','乔峰','丐帮'],severity:88,source:'《丐帮秘典》'},
    {id:'k004',category:'武功',title:'易筋经',content:'易筋经乃少林镇派之宝，由达摩祖师面壁九年所悟。练成可脱胎换骨，内力精进一日千里，百毒不侵。',keywords:['易筋经','少林','达摩','内力','脱胎换骨'],severity:86,source:'《少林武学考》'},
    {id:'k005',category:'武功',title:'六脉神剑',content:'六脉神剑乃大理段氏绝学，以道家真气运行于手臂六脉，凝聚成无形剑气。六脉为少冲、少泽、商阳、关冲、少商、少冲。',keywords:['六脉神剑','大理','段氏','剑气'],severity:84,source:'《大理段氏武功录》'},
    {id:'k006',category:'医道',title:'清凉散',content:'清凉散乃江湖常见解毒良方，主要成分为金银花、菊花、薄荷、连翘。可清热解毒，治疗发烧中暑，是江湖医者必备之药。',keywords:['清凉散','解毒','发烧','金银花','中暑'],severity:60,source:'《江湖药典》'},
    {id:'k007',category:'医道',title:'金创药',content:'金创药用于治疗刀剑外伤，主要成分为三七、血竭、麝香。敷于伤口可止血生肌，加速愈合。江湖侠客必备之物。',keywords:['金创药','外伤','止血','三七','伤口'],severity:65,source:'《医宗金鉴》'},
    {id:'k008',category:'医道',title:'九转还魂丹',content:'九转还魂丹乃失传已久的续命神药，以九味药材历经九转炼制。可令重伤者死而复生，但炼制极难，百年难得一见。',keywords:['九转还魂丹','续命','死而复生','神药'],severity:95,source:'《丹道秘录》'},
    {id:'k009',category:'医道',title:'断肠散',content:'断肠散乃江湖毒门秘传剧毒，无色无味，入口即溶。中毒者肠断身死，无药可解。常出现在武林仇杀之中。',keywords:['断肠散','剧毒','毒门','仇杀'],severity:72,source:'《百毒图》'},
    {id:'k010',category:'江湖',title:'武林大会',content:'武林大会每十年举办一次，由各门派推选高手参加，争夺武林盟主之位。历届盟主多出自少林、武当、丐帮三大派。',keywords:['武林大会','盟主','少林','丐帮','十年'],severity:75,source:'《江湖见闻录》'},
    {id:'k011',category:'江湖',title:'少林七十二绝技',content:'少林七十二绝技乃天下武学之冠，包含般若掌、大韦驮杵、罗汉拳等。少林弟子需按部就班修习，不可躐等。',keywords:['少林','七十二绝技','武功','绝技'],severity:80,source:'《少林武学考》'},
    {id:'k012',category:'江湖',title:'丐帮帮规',content:'丐帮乃江湖最大帮会，分九袋长老、四大弟子。帮规第一条：不得滥杀无辜。帮主由棍棒功与降龙掌传位。',keywords:['丐帮','帮规','长老','帮主'],severity:70,source:'《丐帮家法》'},

    {id:'k014',category:'地理',title:'少林寺',content:'少林寺位于河南嵩山少室山下，乃佛门祖庭。寺内藏有易筋经、洗髓经等绝世武学典籍，历代住持皆为武林高手。',keywords:['少林寺','嵩山','河南','佛门'],severity:78,source:'《江湖地理志》'},
    {id:'k015',category:'地理',title:'桃花岛',content:'桃花岛位于东海之滨，岛上遍植桃花，美若仙境。岛上藏有奇门阵法与绝顶武学，乃东邪黄药师的居所。',keywords:['桃花岛','东海','黄药师','奇门'],severity:74,source:'《江湖地理志》'},
    {id:'k016',category:'历史',title:'华山论剑',content:'华山论剑乃武林盛事，东邪西毒南帝北丐中神通五绝争锋。第一次论剑王重阳胜出，第二次东邪黄药师夺魁。',keywords:['华山论剑','五绝','东邪','西毒'],severity:82,source:'《武林秘闻》'},
    {id:'k017',category:'历史',title:'九阴真经',content:'九阴真经乃天下武学总纲，分内功外功两部分。相传为前朝皇后所著，经多次转手，引发无数江湖血案。',keywords:['九阴真经','武学总纲','内功','外功'],severity:92,source:'《武林秘闻》'},
    {id:'k018',category:'民俗',title:'屠狗少年',content:'丐帮规矩：入门弟子须先以屠狗为业三年，洗去尘世心，方能习武。此为"屠狗少年"典故之源。',keywords:['屠狗','丐帮','入门','弟子'],severity:55,source:'《江湖见闻录》'}
  ],
  keywordIndex: {},
  categoryIndex: {}
};

var NPC_LIST = [
  {id:'A',name:'云溪',role:'侠客',icon:'⚔️',cats:['武功','江湖']},
  {id:'B',name:'阿福',role:'村民',icon:'🍞',cats:['民俗','地理']},
  {id:'C',name:'小翠',role:'药师',icon:'🌿',cats:['医道','民俗']},
  {id:'D',name:'老村长',role:'长者',icon:'🏮',cats:['历史','江湖']},
  {id:'E',name:'书生',role:'儒生',icon:'📜',cats:['历史','地理']}
];
var selectedNPC = null;
var searchCount = 0;
var lastSearchQuery = '';
var lastRetrievedDocs = [];

/* ═══════════════ 索引构建 ═══════════════ */
function initKnowledgeIndex(){
  KB.keywordIndex = {};
  KB.categoryIndex = {};
  KB.entries.forEach(function(entry){
    entry.keywords.forEach(function(kw){
      if(!KB.keywordIndex[kw])KB.keywordIndex[kw]=[];
      KB.keywordIndex[kw].push(entry);
    });
    if(!KB.categoryIndex[entry.category])KB.categoryIndex[entry.category]=[];
    KB.categoryIndex[entry.category].push(entry);
  });
}

/* ═══════════════ 检索引擎 ═══════════════ */
function extractKeywords(text){
  var stopWords=['的','了','是','在','我','你','他','她','它','们','这','那','什么','怎么','如何','请问','告诉','一下','能否','可以','能不能'];
  var cleaned = text.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,' ').split(/\s+/).filter(function(w){return w.length>1&&stopWords.indexOf(w)===-1;});
  return cleaned.slice(0,8);
}

function getRelevantCats(){
  if(!selectedNPC)return ['武功','医道','江湖'];
  var npc = NPC_LIST.find(function(n){return n.id===selectedNPC;});
  return npc ? npc.cats : ['武功','医道','江湖'];
}

function retrieveKnowledge(query, topK){
  topK = topK || 3;
  var queryKws = extractKeywords(query);
  var candidates = [];
  var querySet = {};
  queryKws.forEach(function(kw){querySet[kw]=true;});

  KB.entries.forEach(function(entry){
    var score = 0;
    var matchedKw = 0;
    entry.keywords.forEach(function(kw){
      if(querySet[kw]){score+=15;matchedKw++;}
    });
    entry.title.split(' ').forEach(function(word){
      if(word.length>1 && query.indexOf(word)!==-1){score+=8;}
    });
    var qParts = query.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,' ').split(/\s+/);
    qParts.forEach(function(qp){
      if(qp.length>1 && entry.content.indexOf(qp)!==-1){score+=5;matchedKw++;}
    });
    var relCats = getRelevantCats();
    if(relCats.indexOf(entry.category)!==-1){score+=5;}
    if(matchedKw>0){candidates.push({entry:entry,score:score});}
  });

  var byContent = KB.entries.map(function(e){return {entry:e,score:0};});
  byContent.forEach(function(c){
    var hits = 0;
    queryKws.forEach(function(kw){if(c.entry.content.indexOf(kw)!==-1)hits++;});
    c.score = hits*10;
    if(c.score>0)candidates.push(c);
  });

  var seen = {};
  var dedup = candidates.filter(function(c){
    if(seen[c.entry.id])return false;
    seen[c.entry.id]=true;return true;
  });
  dedup.sort(function(a,b){return b.score-a.score;});
  return dedup.slice(0,topK);
}

/* ═══════════════ RAG 对话生成 ═══════════════ */
function generatePureRoleResponse(npc, query){
  var responses = {
    '武功':'我略懂一些武艺，但不敢在人前逞强，您还是去问问那些江湖前辈吧。',
    '医道':'我不懂医术，不过村里的小翠似乎挺懂药理，你要不问问她？',
    '江湖':'我这种人一辈子没出过远门，江湖上的事实在不知，惭愧惭愧。',
    '地理':'这些山川地理的事，我哪记得住，您还是翻翻地图吧。',
    '历史':'旧事隔了太久，我记不清了，或许老村长知道。',
    '民俗':'这事我倒知道一些...咱们村里老人常说，凡事有个讲究，不可马虎。',
    '默认':'嗯...您问的这个，我一时答不上来。容我回去翻翻书卷再答复您。'
  };
  for(var key in responses){
    if(query.indexOf(key)!==-1)return npc.name+'想了想说道：「'+responses[key]+'」';
  }
  return npc.name+'听了你的问题，摇了摇头：「这事我也不太清楚，或许可以问问别人。」';
}

function generateRAGResponse(npc, query, docs){
  var context = docs.map(function(d,i){return '【资料'+(i+1)+'】'+d.title+'（'+d.source+'）：'+d.content;}).join('\n');
  var catLabel = {武功:'武学典籍',医道:'药典方书',江湖:'江湖录',地理:'地理志',历史:'秘闻',民俗:'风俗志'};
  var catName = catLabel[docs[0].category]||'古籍';
  var intro = {
    '武功':'您问的这门武艺，我恰好翻到过相关典籍。',
    '医道':'您问的这个方子，我在药典里查到过记载。',
    '江湖':'江湖上的事，我在见闻录里读到过。',
    '地理':'这些山川地理的事，地理志里有详细记载。',
    '历史':'旧事虽远，武林秘闻中倒有相关记述。',
    '民俗':'这事儿在乡野风俗志里倒有提及。'
  };
  var lead = intro[docs[0].category]||'让我翻翻手中的典籍。';
  var body = docs.slice(0,2).map(function(d){return d.content;}).join(' ');
  var refs = docs.map(function(d){return '（'+d.source+'·'+d.title+'）';}).join('');
  return npc.name+lead+'「'+body+'」'+refs+'——便是这些典籍中的说法。';
}

/* ═══════════════ UI 渲染 ═══════════════ */
function renderNPCOptions(){
  var el = document.getElementById('npc-options');
  el.innerHTML = '';
  NPC_LIST.forEach(function(npc){
    var chip = document.createElement('div');
    chip.className = 'npc-chip'+(selectedNPC===npc.id?' selected':'');
    chip.innerHTML = npc.icon+' '+npc.name+'<span class="npc-role">'+npc.role+'</span>';
    chip.onclick = function(){selectNPC(npc.id);};
    el.appendChild(chip);
  });
}

function selectNPC(id){
  selectedNPC = id;
  renderNPCOptions();
  var npc = NPC_LIST.find(function(n){return n.id===id;});
  document.getElementById('chat-npc-badge').textContent = npc.icon+' '+npc.name+' · '+npc.role;
  if(lastSearchQuery)performSearch(false);
}

function updateStats(){
  document.getElementById('stat-entries').textContent = KB.entries.length;
  var cats = {};
  KB.entries.forEach(function(e){cats[e.category]=true;});
  document.getElementById('stat-categories').textContent = Object.keys(cats).length;
  document.getElementById('stat-searches').textContent = searchCount;
  document.getElementById('kb-count').textContent = KB.entries.length;
}

function renderKBList(){
  var el = document.getElementById('kb-list');
  el.innerHTML = '';
  KB.entries.forEach(function(e){
    var item = document.createElement('div');
    item.className='kb-item';
    item.innerHTML = '<div class="kb-item-title">'+e.title+'<span class="kb-item-cat">'+e.category+'</span></div><div class="kb-item-meta">'+e.source+' · 相关度 '+e.severity+'</div>';
    el.appendChild(item);
  });
}

function animateFlow(){
  var container = document.getElementById('flow-container');
  container.style.display='flex';
  var steps = ['flow-keywords','flow-retrieve','flow-rank','flow-inject','flow-generate','flow-guard'];
  steps.forEach(function(id){document.getElementById(id).className='flow-step';});
  var delay = 0;
  steps.forEach(function(id,i){
    setTimeout(function(){
      document.getElementById(id).className='flow-step active';
    },delay);
    delay+=200;
    setTimeout(function(){
      document.getElementById(id).className='flow-step done';
    },delay+100);
  });
}

function performSearch(animate){
  var query = document.getElementById('search-input').value.trim();
  if(!query)return;
  lastSearchQuery = query;
  searchCount++;
  if(animate!==false)animateFlow();
  var docs = retrieveKnowledge(query,3);
  lastRetrievedDocs = docs;
  renderResults(docs,query);
  updateStats();
}

function renderResults(docs,query){
  var el = document.getElementById('results-list');
  if(docs.length===0){
    el.innerHTML = '<div class="empty-state"><div class="eicon">📭</div><div class="etext">未找到相关内容</div><div class="ehint">试试其他关键词，如：太极、少林、金创药、华山</div></div>';
    return;
  }
  el.innerHTML = '';
  docs.forEach(function(c,i){
    var doc = c.entry;
    var card = document.createElement('div');
    card.className='result-card';
    var pct = Math.min(95,Math.max(30,Math.round(80-i*15+(c.score||0)/3)));
    card.innerHTML =
      '<div class="result-header"><span class="result-title">'+(i+1)+'. '+doc.title+'</span><span class="result-score">'+pct+'%</span></div>'+
      '<div class="result-category">'+doc.category+' · '+doc.severity+' 相关度</div>'+
      '<div class="result-content">'+doc.content+'</div>'+
      '<div class="result-source">来源：'+doc.source+'</div>'+
      '<div class="result-keywords">'+doc.keywords.map(function(kw){return '<span class="result-kw">'+kw+'</span>';}).join('')+'</div>';
    el.appendChild(card);
  });
}

function toggleComparison(){
  var section = document.getElementById('comparison-section');
  var btn = document.getElementById('compare-toggle');
  if(section.classList.contains('visible')){
    section.classList.remove('visible');
    btn.classList.remove('active');
    return;
  }
  if(!lastSearchQuery){document.getElementById('search-input').focus();return;}
  section.classList.add('visible');
  btn.classList.add('active');
  var npc = selectedNPC ? NPC_LIST.find(function(n){return n.id===selectedNPC;}) : NPC_LIST[0];
  var noRagEl = document.getElementById('no-rag-content');
  var withRagEl = document.getElementById('with-rag-content');
  var thinkingEl = document.getElementById('rag-thinking');
  noRagEl.textContent='生成中...';noRagEl.classList.add('loading');
  withRagEl.textContent='检索 + 生成中...';withRagEl.classList.add('loading');
  thinkingEl.textContent='';
  setTimeout(function(){
    noRagEl.classList.remove('loading');
    noRagEl.textContent = generatePureRoleResponse(npc, lastSearchQuery);
  },600);
  setTimeout(function(){
    withRagEl.classList.remove('loading');
    var docs = lastRetrievedDocs.length>0 ? lastRetrievedDocs.map(function(c){return c.entry;}) : retrieveKnowledge(lastSearchQuery,3).map(function(c){return c.entry;});
    withRagEl.textContent = docs.length>0 ? generateRAGResponse(npc, lastSearchQuery, docs) : '未检索到相关知识，回退为纯角色回答：'+generatePureRoleResponse(npc, lastSearchQuery);
    thinkingEl.textContent = docs.length>0 ? '📚 注入 '+docs.length+' 条知识 · 来源: '+docs.map(function(d){return d.source;}).join(', ') : '未检索到知识';
  },1400);
}

/* ═══════════════ 对话功能 ═══════════════ */
function sendChat(){
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if(!text)return;
  input.value='';
  var msgs = document.getElementById('chat-messages');
  var userMsg = document.createElement('div');
  userMsg.className='chat-msg user';
  userMsg.innerHTML='<div class="chat-bubble">'+escHtml(text)+'</div><div class="chat-meta">你 · '+nowStr()+'</div>';
  msgs.appendChild(userMsg);

  var npc = selectedNPC ? NPC_LIST.find(function(n){return n.id===selectedNPC;}) : NPC_LIST[0];
  setTimeout(function(){
    var docs = retrieveKnowledge(text,3);
    var isRag = docs.length>0;
    var response = isRag ? generateRAGResponse(npc, text, docs) : generatePureRoleResponse(npc, text);
    var agentMsg = document.createElement('div');
    agentMsg.className='chat-msg agent';
    var ragNote = isRag ? '<div class="chat-rag-indicator">RAG 检索 · '+docs.length+' 条知识 · '+docs.map(function(d){return d.title;}).join(', ')+'</div>' : '';
    agentMsg.innerHTML='<div class="chat-agent-avatar">'+npc.icon+'</div><div class="chat-bubble">'+escHtml(response)+' '+ragNote+'</div><div class="chat-meta">'+npc.name+' · '+npc.role+' · '+nowStr()+'</div>';
    msgs.appendChild(agentMsg);
    msgs.scrollTop=msgs.scrollHeight;
  },500+Math.random()*500);
  msgs.scrollTop=msgs.scrollHeight;
}

function nowStr(){
  var d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');
}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ═══════════════ 初始化 ═══════════════ */
function init(){
  initKnowledgeIndex();
  renderNPCOptions();
  renderKBList();
  updateStats();
  selectedNPC='A';
  renderNPCOptions();
  var npc=NPC_LIST[0];
  document.getElementById('chat-npc-badge').textContent=npc.icon+' '+npc.name+' · '+npc.role;
}
init();
</script>
