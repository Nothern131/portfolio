<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖知识库 · RAG 检索演示</title>
<style>
:root{
  --bg-deep:oklch(11% 0.01 30);
  --bg-surface:oklch(15% 0.012 30);
  --bg-elevated:oklch(20% 0.015 30);
  --bg-card:oklch(18% 0.012 30);
  --text-primary:oklch(94% 0.005 80);
  --text-secondary:oklch(78% 0.006 80);
  --text-muted:oklch(52% 0.008 70);
  --gold:#f4c15a;--jade:#34d399;--crimson:#f87171;
  --amber:#fbbf24;--purple:#a78bfa;--azurite:#38bdf8;
  --jade-dim:oklch(55% 0.15 145/0.15);
  --gold-dim:oklch(55% 0.15 85/0.15);
  --purple-dim:oklch(55% 0.15 300/0.15);
  --azurite-dim:oklch(55% 0.15 230/0.15);
  --crimson-dim:oklch(55% 0.15 25/0.15);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 8px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --mono:'JetBrains Mono','Cascadia Code','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* 粒子背景 */
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
#cursor-glow{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,oklch(55% 0.12 85/0.04) 0%,transparent 70%);
  transform:translate(-50%,-50%);transition:opacity .3s var(--ease);opacity:0;will-change:transform}

/* 顶部 */
#top-bar{position:sticky;top:0;z-index:100;padding:12px 24px;background:oklch(11% 0.01 30/0.9);backdrop-filter:blur(12px);border-bottom:1px solid oklch(25% 0.012 30/0.5);display:flex;align-items:center;gap:16px}
#top-bar h1{font-size:16px;font-weight:700;letter-spacing:.08em;background:linear-gradient(90deg,var(--gold),var(--jade));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#top-bar .subtitle{font-size:11px;color:var(--text-muted);letter-spacing:.05em}
#kb-stats{margin-left:auto;display:flex;gap:12px;font-size:11px;font-family:var(--mono);color:var(--text-muted)}
#kb-stats span{padding:2px 8px;background:var(--bg-card);border-radius:4px;transition:background .3s}
#kb-stats b{color:var(--jade)}

/* 主体布局 */
#main{position:relative;z-index:2;display:grid;grid-template-columns:1fr 400px;gap:0;min-height:calc(100vh - 52px)}
#left-panel{padding:20px;overflow-y:auto;max-height:calc(100vh - 52px)}
#right-panel{border-left:1px solid oklch(25% 0.012 30/0.5);padding:16px;overflow-y:auto;max-height:calc(100vh - 52px);background:var(--bg-surface)}

/* NPC 选择 */
.npc-selector{margin-bottom:20px;padding:14px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4)}
.npc-selector h3{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.npc-options{display:flex;gap:8px;flex-wrap:wrap}
.npc-chip{padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid oklch(25% 0.012 30/0.6);color:var(--text-secondary);transition:all .25s var(--ease);user-select:none;position:relative;overflow:hidden}
.npc-chip::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--jade-dim),transparent 70%);opacity:0;transition:opacity .3s}
.npc-chip:hover{border-color:var(--jade);color:var(--jade);transform:translateY(-1px)}
.npc-chip:hover::before{opacity:1}
.npc-chip.selected{background:var(--jade-dim);border-color:var(--jade);color:var(--jade);font-weight:600;box-shadow:0 0 12px var(--jade-dim)}
.npc-role{font-size:9px;opacity:.6;margin-left:4px}

/* NPC 专属知识面板 */
#npc-kb-panel{margin-bottom:20px;padding:16px;background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-elevated) 100%);border-radius:var(--radius);border:1px solid oklch(25% 0.012 30/0.4);transition:all .4s var(--ease);opacity:0;transform:translateY(12px)}
#npc-kb-panel.visible{opacity:1;transform:translateY(0)}
.npc-kb-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid oklch(25% 0.012 30/0.3)}
.npc-kb-avatar{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);border:2px solid var(--jade-dim);border-radius:12px;animation:avatarPulse 3s ease-in-out infinite}
@keyframes avatarPulse{0%,100%{box-shadow:0 0 0 0 var(--jade-dim)}50%{box-shadow:0 0 16px 4px var(--jade-dim)}}
.npc-kb-name{font-size:14px;font-weight:700;color:var(--text-primary)}
.npc-kb-role{font-size:10px;color:var(--text-muted)}
.npc-kb-tags{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.npc-kb-tag{font-size:9px;padding:1px 6px;background:var(--azurite-dim);color:var(--azurite);border-radius:3px;font-family:var(--mono)}
.npc-kb-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--text-muted)}
.npc-kb-items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kb-entry{padding:10px;background:var(--bg-surface);border-radius:var(--radius-xs);border:1px solid oklch(25% 0.012 30/0.3);transition:transform .3s var(--ease-bounce),box-shadow .3s var(--ease),border-color .25s;animation:entryIn .4s var(--ease-bounce) both;cursor:default;will-change:transform}
.kb-entry:nth-child(1){animation-delay:.05s}.kb-entry:nth-child(2){animation-delay:.1s}.kb-entry:nth-child(3){animation-delay:.15s}.kb-entry:nth-child(4){animation-delay:.2s}.kb-entry:nth-child(5){animation-delay:.25s}.kb-entry:nth-child(6){animation-delay:.3s}
@keyframes entryIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.kb-entry:hover{border-color:var(--gold);background:var(--bg-elevated);transform:translateY(-4px) scale(1.03);
  box-shadow:2px 0 0 rgba(255,71,87,.25),-2px 0 0 rgba(0,217,255,.25),0 12px 24px rgba(0,0,0,.35)}
.kb-entry-title{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.kb-entry-source{font-size:9px;color:var(--text-muted);font-family:var(--mono)}
.kb-entry-content{font-size:11px;color:var(--text-secondary);line-height:1.5;margin-top:4px;max-height:0;overflow:hidden;transition:max-height .3s var(--ease),margin .3s}
.kb-entry:hover .kb-entry-content{max-height:80px}

/* 检索区 */
.search-section{margin-bottom:20px}
.search-section h2{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;letter-spacing:.06em}
#search-input{width:100%;padding:10px 14px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
#search-input:focus{border-color:var(--jade);box-shadow:0 0 12px var(--jade-dim)}
#search-input::placeholder{color:var(--text-muted)}
.search-actions{display:flex;gap:8px;margin-top:10px}
#search-btn{padding:8px 20px;background:linear-gradient(135deg,var(--jade),var(--azurite));color:oklch(8% 0.01 145);border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
#search-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s var(--ease)}
#search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--jade-dim)}
#search-btn:hover::after{transform:translateX(100%)}
#search-btn:active{transform:scale(.96)}
#compare-toggle{padding:8px 16px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .25s var(--ease)}
#compare-toggle:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
#compare-toggle.active{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}

/* 检索进度条 */
.search-progress{height:3px;background:var(--rule-subtle,oklch(25% 0.012 30/0.4));border-radius:2px;overflow:hidden;margin-top:8px;opacity:0;transition:opacity .3s}
.search-progress.active{opacity:1}
.search-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--jade),var(--azurite));transition:width .6s var(--ease);border-radius:2px;box-shadow:0 0 8px var(--jade-dim)}

/* 流程动画 */
.flow-container{display:flex;align-items:center;gap:6px;margin:12px 0;padding:10px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.3);overflow:hidden}
.flow-step{flex:1;text-align:center;padding:6px 4px;border-radius:4px;font-size:9px;color:var(--text-muted);transition:all .35s var(--ease);position:relative}
.flow-step.active{background:var(--jade-dim);color:var(--jade);font-weight:600;animation:flowPulse 1s ease-in-out infinite}
.flow-step.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--jade);border-radius:1px;animation:shimmer 1s linear infinite}
.flow-step.done{background:var(--gold-dim);color:var(--gold);transform:scale(1.05)}
@keyframes flowPulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.flow-arrow{color:var(--text-muted);font-size:10px;flex-shrink:0;transition:color .3s}
.flow-arrow.active{color:var(--jade)}

/* 检索结果 */
#results-section{margin-bottom:20px}
#results-title{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
#results-list{display:flex;flex-direction:column;gap:10px}
.result-card{padding:14px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4);border-left:3px solid var(--gold);transition:transform .3s var(--ease-bounce),box-shadow .3s var(--ease);animation:cardIn .4s var(--ease-bounce) both;cursor:default;position:relative;overflow:hidden;will-change:transform}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--jade),transparent);opacity:0;transition:opacity .3s}
.result-card:nth-child(1){animation-delay:.05s}
.result-card:nth-child(2){animation-delay:.15s}
.result-card:nth-child(3){animation-delay:.25s}
.result-card:hover{transform:translateY(-6px) scale(1.02);border-left-color:var(--jade);
  box-shadow:2px 0 0 rgba(255,71,87,.3),-2px 0 0 rgba(0,217,255,.3),0 20px 40px rgba(0,0,0,.3)}
.result-card:hover::before{opacity:1}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-title{font-size:13px;font-weight:600;color:var(--gold)}
.result-score{font-size:10px;font-family:var(--mono);color:var(--jade);background:var(--jade-dim);padding:2px 8px;border-radius:4px;animation:scoreIn .5s var(--ease-bounce) .3s both}
@keyframes scoreIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.result-category{font-size:10px;color:var(--text-muted);margin-bottom:6px}
.result-content{font-size:12px;color:var(--text-secondary);line-height:1.6;opacity:.85}
.result-source{font-size:10px;color:var(--text-muted);margin-top:8px;font-family:var(--mono);opacity:.6}
.result-keywords{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.result-kw{font-size:9px;padding:1px 6px;background:var(--purple-dim);color:var(--purple);border-radius:3px;font-family:var(--mono)}
.result-owner{font-size:10px;color:var(--azurite);margin-top:4px;display:flex;align-items:center;gap:4px}

/* 空状态 */
.empty-state{text-align:center;padding:32px;color:var(--text-muted)}
.empty-state .eicon{font-size:36px;margin-bottom:8px;opacity:.5;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty-state .etext{font-size:13px;margin-bottom:4px}
.empty-state .ehint{font-size:10px;opacity:.5}

/* 对比区 */
#comparison-section{display:none;margin-bottom:20px}
#comparison-section.visible{display:block;animation:compareIn .4s var(--ease-bounce)}
@keyframes compareIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.comparison-container{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comparison-panel{padding:14px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid oklch(25% 0.012 30/0.4);transition:border-color .3s}
.comparison-panel:hover{border-color:oklch(30% 0.015 30/0.5)}
.comparison-label{font-size:10px;font-weight:600;letter-spacing:.06em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid oklch(25% 0.012 30/0.4)}
.comparison-label.no-rag{color:var(--crimson)}
.comparison-label.with-rag{color:var(--jade)}
.comparison-content{font-size:12px;color:var(--text-secondary);line-height:1.6;min-height:40px}
.comparison-content.loading{color:var(--text-muted);font-style:italic}
.comparison-thinking{font-size:10px;color:var(--azurite);margin-top:6px;font-family:var(--mono)}

/* 右侧面板：对话 */
#chat-section h2{font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
#chat-section h2 .badge{font-size:9px;padding:1px 6px;background:var(--jade-dim);color:var(--jade);border-radius:3px;font-weight:500;transition:all .3s}
#chat-messages{flex:1;overflow-y:auto;max-height:420px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.chat-msg{animation:msgIn .35s var(--ease-bounce) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.95)}40%{transform:translateY(-2px) scale(1.005)}to{opacity:1;transform:translateY(0) scale(1)}}
.chat-msg.user .chat-bubble{background:var(--bg-elevated);border:1px solid oklch(25% 0.012 30/0.5);align-self:flex-end;max-width:85%}
.chat-msg.agent .chat-bubble{background:var(--jade-dim);border:1px solid oklch(55% 0.15 145/0.25);align-self:flex-start;max-width:85%}
.chat-msg.agent:hover .chat-bubble{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .2s}
.chat-bubble{padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.6;color:var(--text-secondary)}
.chat-meta{font-size:9px;color:var(--text-muted);margin-top:4px;font-family:var(--mono)}
.chat-msg.user .chat-meta{text-align:right}
.chat-agent-avatar{font-size:18px}
.chat-rag-indicator{font-size:10px;color:var(--azurite);margin-top:4px;display:flex;align-items:center;gap:4px}
.chat-rag-indicator .rag-dot{width:6px;height:6px;border-radius:50%;background:var(--jade);animation:ragDotPulse 1.5s ease-in-out infinite}
@keyframes ragDotPulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.chat-typing{display:flex;gap:4px;padding:8px 12px}
.chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:typingBounce 1s ease-in-out infinite}
.chat-typing span:nth-child(2){animation-delay:.15s}
.chat-typing span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* 对话输入 */
#chat-input-row{display:flex;gap:8px}
#chat-input{flex:1;padding:8px 12px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.6);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;outline:none;transition:border-color .2s,box-shadow .2s}
#chat-input:focus{border-color:var(--jade);box-shadow:0 0 8px var(--jade-dim)}
#chat-input::placeholder{color:var(--text-muted)}
#chat-send-btn{padding:8px 14px;background:linear-gradient(135deg,var(--jade),var(--azurite));color:oklch(8% 0.01 145);border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0;position:relative}
#chat-send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--jade-dim)}
#chat-send-btn:active{transform:scale(.95)}

/* 对话快捷标签 */
.chat-quick-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chat-quick-tag{font-size:10px;padding:3px 10px;background:var(--bg-card);border:1px solid oklch(25% 0.012 30/0.5);border-radius:12px;color:var(--text-muted);cursor:pointer;transition:all .2s var(--ease-bounce)}
.chat-quick-tag:hover{border-color:var(--jade);color:var(--jade);background:var(--jade-dim);transform:scale(1.05)}
.chat-quick-tag:active{transform:scale(.95)}

/* 知识库浏览 */
#kb-section{margin-top:16px}
#kb-section h3{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.kb-list{display:flex;flex-direction:column;gap:6px}
.kb-item{padding:8px 10px;background:var(--bg-card);border-radius:var(--radius-xs);border:1px solid oklch(25% 0.012 30/0.3);transition:transform .25s var(--ease-bounce),box-shadow .25s,border-color .2s;cursor:default}
.kb-item:hover{border-color:var(--gold);background:var(--bg-elevated);transform:translateX(3px) scale(1.01);
  box-shadow:2px 0 0 rgba(255,71,87,.15),-2px 0 0 rgba(0,217,255,.15)}
.kb-item-title{font-size:11px;font-weight:600;color:var(--gold);margin-bottom:2px}
.kb-item-meta{font-size:9px;color:var(--text-muted)}
.kb-item-cat{display:inline-block;font-size:9px;padding:0 4px;background:var(--azurite-dim);color:var(--azurite);border-radius:3px;margin-left:4px}

/* 响应式 */
@media(max-width:900px){
  #main{grid-template-columns:1fr}
  #right-panel{border-left:none;border-top:1px solid oklch(25% 0.012 30/0.5)}
  .comparison-container{grid-template-columns:1fr}
  .npc-kb-items{grid-template-columns:1fr}
}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:oklch(30% 0.01 30/0.5);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:oklch(40% 0.01 30/0.6)}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div id="cursor-glow"></div>

<div id="top-bar">
  <h1>📚 江湖知识库</h1>
  <span class="subtitle">RAG 检索增强生成 · 武侠世界专属</span>
  <div id="kb-stats">
    <span>条目: <b id="stat-entries">0</b></span>
    <span>专属: <b id="stat-exclusive">0</b></span>
    <span>检索: <b id="stat-searches">0</b></span>
  </div>
</div>

<div id="main">
  <div id="left-panel">
    <!-- NPC 身份选择 -->
    <div class="npc-selector">
      <h3>当前 NPC 身份</h3>
      <div class="npc-options" id="npc-options"></div>
    </div>

    <!-- NPC 专属知识库 -->
    <div id="npc-kb-panel">
      <div class="npc-kb-header">
        <div class="npc-kb-avatar" id="npc-kb-avatar">⚔️</div>
        <div>
          <div class="npc-kb-name" id="npc-kb-name">云溪</div>
          <div class="npc-kb-role" id="npc-kb-role">侠客</div>
          <div class="npc-kb-tags" id="npc-kb-tags"></div>
        </div>
        <div class="npc-kb-count" id="npc-kb-count">4 条专属知识</div>
      </div>
      <div class="npc-kb-items" id="npc-kb-items"></div>
    </div>

    <!-- 检索区 -->

function extractKeywords(text){

  return cleaned.slice(0,8);
}

function getRelevantCats(){
  var npc=getNPC(selectedNPC);
  return npc?npc.cats:['武功','医道','江湖'];
}

function retrieveKnowledge(query,topK){
  topK=topK||3;
  var allEntries=getAllEntries();
  var queryKws=extractKeywords(query);
  var querySet={};
  queryKws.forEach(function(kw){querySet[kw]=true;});
  var relCats=getRelevantCats();
  var npcKB=selectedNPC?NPC_KB[selectedNPC]:[];
  var candidates=[];

  allEntries.forEach(function(entry){
    var score=0;
    var matchedKw=0;
    entry.keywords.forEach(function(kw){
      if(querySet[kw]){score+=15;matchedKw++;}
    });
    entry.title.split('').forEach(function(word){
      if(word.length>1&&query.indexOf(word)!==-1){score+=8;}
    });
    var qParts=query.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,' ').split(/\s+/);
    qParts.forEach(function(qp){
      if(qp.length>1&&entry.content.indexOf(qp)!==-1){score+=5;matchedKw++;}
    });
    if(relCats.indexOf(entry.category)!==-1){score+=5;}
    var isNpcEntry=!!npcKB.find(function(n){return n.id===entry.id;});
    if(isNpcEntry){score+=12;}
    if(matchedKw>0){candidates.push({entry:entry,score:score,isNpc:isNpcEntry});}
  });

  var byContent=allEntries.map(function(e){return {entry:e,score:0,isNpc:!!npcKB.find(function(n){return n.id===e.id;})};});
  byContent.forEach(function(c){
    var hits=0;
    queryKws.forEach(function(kw){if(c.entry.content.indexOf(kw)!==-1)hits++;});
    c.score=hits*10;
    if(c.score>0)candidates.push(c);
  });

  var seen={};
  var dedup=candidates.filter(function(c){
    if(seen[c.entry.id])return false;
    seen[c.entry.id]=true;return true;
  });
  dedup.sort(function(a,b){return b.score-a.score;});
  return dedup.slice(0,topK);
}

/* ═══════════════ RAG 对话生成 ═══════════════ */
function generatePureRoleResponse(npc,query){
  var roleResponses={
    '侠客':'{name}略懂一些武艺，但不敢在人前逞强，您还是去问问那些江湖前辈吧。',
    '村民':'{name}不懂江湖事，不过村里的{npc2}似乎知道一些，你要不问问{npc2}？',
    '药师':'{name}不懂武艺，但草药医道{name}倒有几分心得。',
    '长者':'{name}老了，记性不好，这些事{name}记不清了。',
    '儒生':'{name}不习武，只读圣贤书，这些事{name}或许可以从史书中找到答案。'
  };
  var npcNames=NPC_LIST.map(function(n){return n.name;}).filter(function(n){return n!==npc.name;});
  var tpl=roleResponses[npc.role]||'{name}想了想：这事我也不太清楚，或许可以问问别人。';
  var text=tpl.replace('{name}',npc.name).replace('{npc2}',npcNames[0]);
  var specific={
    '武功':'我略懂一些武艺，但不敢在人前逞强。',
    '医道':'我不懂医术，不过村里的小翠似乎挺懂药理。',
    '江湖':'我这种人一辈子没出过远门，江湖上的事实在不知。',
    '地理':'这些山川地理的事，我哪记得住。',
    '历史':'旧事隔了太久，我记不清了。',
    '民俗':'这事我倒知道一些...咱们村里老人常说，凡事有个讲究。'
  };
  var hint='';
  for(var key in specific){
    if(query.indexOf(key)!==-1){hint=specific[key];break;}
  }
  return npc.name+'想了想说道：「'+(hint||text)+'」';
}

function generateRAGResponse(npc,query,docs){
  var catIntro={
    '武功':'您问的这门武艺，我恰好翻到过相关典籍。',
    '医道':'您问的这个方子，我在药典里查到过记载。',
    '江湖':'江湖上的事，我在见闻录里读到过。',
    '地理':'这些山川地理的事，地理志里有详细记载。',
    '历史':'旧事虽远，武林秘闻中倒有相关记述。',
    '民俗':'这事儿在乡野风俗志里倒有提及。'
  };
  var lead=catIntro[docs[0].category]||'让我翻翻手中的典籍。';
  var body=docs.slice(0,2).map(function(d){return d.content;}).join(' ');
  var refs=docs.map(function(d){
    var tag=d.isNpc?' · '+getNPC(NPC_KB[d.entryId||'A']? 'A':'A').name+'手记':' · '+d.source;
    return '（'+d.source+tag+'）';
  }).join(' ');
  var roleFlavor={
    '侠客':'我虽非医者，但武学典籍倒是常翻。',
    '村民':'村里的老人说过类似的话，我记了个大概。',
    '药师':'这正是我在药田边常念叨的方子。',
    '长者':'老朽走南闯北，倒见过不少相关记载。',
    '儒生':'此问题可考诸史书，我近日恰好读到。'
  };
  var flavor=roleFlavor[npc.role]||'让我翻翻手中的典籍。';
  return npc.name+'：「'+flavor+' '+lead+' '+body+'」'+refs;
}

function selectNPC(id){

  renderNPCOptions();

function renderNPCKBPanel(npc){

  setTimeout(function(){panel.classList.add('visible');},50);

function updateStats(){
  var all=getAllEntries();
  document.getElementById('stat-entries').textContent=all.length;
  var exclusive=0;
  for(var k in NPC_KB){exclusive+=NPC_KB[k].length;}
  document.getElementById('stat-exclusive').textContent=exclusive;
  document.getElementById('stat-searches').textContent=searchCount;
  document.getElementById('kb-count').textContent=all.length;
}

function renderKBList(){
  var el=document.getElementById('kb-list');
  el.innerHTML='';
  var all=getAllEntries();
  all.forEach(function(e){
    var isNpc=!!(NPC_KB.A||[]).find(function(n){return n.id===e.id;})||
      !!(NPC_KB.B||[]).find(function(n){return n.id===e.id;})||
      !!(NPC_KB.C||[]).find(function(n){return n.id===e.id;})||
      !!(NPC_KB.D||[]).find(function(n){return n.id===e.id;})||
      !!(NPC_KB.E||[]).find(function(n){return n.id===e.id;});
    var item=document.createElement('div');
    item.className='kb-item';
    var ownerTag='';
    if(isNpc){
      for(var k in NPC_KB){
        var found=NPC_KB[k].find(function(n){return n.id===e.id;});
        if(found){ownerTag=' <span style="color:var(--azurite);font-size:9px">· '+getNPC(k).name+' 专属</span>';break;}
      }
    }
    item.innerHTML='<div class="kb-item-title">'+e.title+'<span class="kb-item-cat">'+e.category+'</span>'+ownerTag+'</div><div class="kb-item-meta">'+e.source+' · '+e.severity+' 相关度</div>';
    el.appendChild(item);
  });
}

function animateFlow(){
  var container=document.getElementById('flow-container');
  container.style.display='flex';
  var progress=document.getElementById('search-progress');
  var fill=document.getElementById('search-progress-fill');
  progress.classList.add('active');
  fill.style.width='0%';
  var steps=['flow-keywords','flow-retrieve','flow-rank','flow-inject','flow-generate','flow-guard'];
  var arrows=['arrow-1','arrow-2','arrow-3','arrow-4','arrow-5'];
  steps.forEach(function(id){document.getElementById(id).className='flow-step';});
  arrows.forEach(function(id){document.getElementById(id).className='flow-arrow';});
  var delay=0;
  steps.forEach(function(id,i){
    setTimeout(function(){
      document.getElementById(id).className='flow-step active';
      if(arrows[i])document.getElementById(arrows[i]).className='flow-arrow active';
      fill.style.width=Math.round(((i+1)/steps.length)*100)+'%';
    },delay);
    delay+=250;
    setTimeout(function(){
      document.getElementById(id).className='flow-step done';
      if(arrows[i])document.getElementById(arrows[i]).className='flow-arrow';
    },delay+120);
  });
  setTimeout(function(){fill.style.width='0%';progress.classList.remove('active');},delay+800);
}

function performSearch(animate){
  var query=document.getElementById('search-input').value.trim();
  if(!query)return;
  lastSearchQuery=query;
  searchCount++;
  if(animate!==false)animateFlow();
  var docs=retrieveKnowledge(query,3);
  lastRetrievedDocs=docs;
  renderResults(docs,query);
  updateStats();
}

function renderResults(docs,query){
  var el=document.getElementById('results-list');
  if(docs.length===0){
    el.innerHTML='<div class="empty-state"><div class="eicon">📭</div><div class="etext">未找到相关内容</div><div class="ehint">试试其他关键词，如：太极、少林、金创药、华山</div></div>';
    return;
  }
  el.innerHTML='';
  docs.forEach(function(c,i){
    var doc=c.entry;
    var card=document.createElement('div');
    card.className='result-card';
    var pct=Math.min(95,Math.max(30,Math.round(80-i*12+(c.score||0)/2)));
    var ownerTag='';
    var foundOwner='';
    for(var k in NPC_KB){
      var found=NPC_KB[k].find(function(n){return n.id===doc.id;});
      if(found){foundOwner=getNPC(k);break;}
    }
    if(foundOwner){
      ownerTag='<div class="result-owner">'+foundOwner.icon+' '+foundOwner.name+' 专属知识</div>';
    }
    card.innerHTML=
      '<div class="result-header"><span class="result-title">'+(i+1)+'. '+doc.title+'</span><span class="result-score">'+pct+'%</span></div>'+
      '<div class="result-category">'+doc.category+' · '+doc.severity+' 相关度</div>'+
      '<div class="result-content">'+doc.content+'</div>'+
      '<div class="result-source">来源：'+doc.source+'</div>'+
      ownerTag+
      '<div class="result-keywords">'+doc.keywords.map(function(kw){return '<span class="result-kw">'+kw+'</span>';}).join('')+'</div>';
    el.appendChild(card);
  });
}

function toggleComparison(){
  var section=document.getElementById('comparison-section');
  var btn=document.getElementById('compare-toggle');
  if(section.classList.contains('visible')){
    section.classList.remove('visible');
    btn.classList.remove('active');
    return;
  }
  if(!lastSearchQuery){document.getElementById('search-input').focus();return;}
  section.classList.add('visible');
  btn.classList.add('active');
  var npc=getNPC(selectedNPC)||NPC_LIST[0];
  var noRagEl=document.getElementById('no-rag-content');
  var withRagEl=document.getElementById('with-rag-content');
  var thinkingEl=document.getElementById('rag-thinking');
  noRagEl.textContent='生成中...';noRagEl.classList.add('loading');
  withRagEl.textContent='检索 + 生成中...';withRagEl.classList.add('loading');
  thinkingEl.textContent='';
  setTimeout(function(){
    noRagEl.classList.remove('loading');
    noRagEl.textContent=generatePureRoleResponse(npc,lastSearchQuery);
  },600);
  setTimeout(function(){
    withRagEl.classList.remove('loading');
    var docs=lastRetrievedDocs.length>0?lastRetrievedDocs.map(function(c){return {entry:c.entry,source:c.entry.source,isNpc:c.isNpc};}):[];
    if(docs.length===0){
      docs=retrieveKnowledge(lastSearchQuery,3).map(function(c){return {entry:c.entry,source:c.entry.source,isNpc:c.isNpc};});
    }
    withRagEl.textContent=docs.length>0?generateRAGResponse(npc,lastSearchQuery,docs.map(function(d){return d.entry;})):'未检索到相关知识。';
    thinkingEl.textContent=docs.length>0?'📚 注入 '+docs.length+' 条知识 · '+docs.map(function(d){return d.source;}).join(', '):'未检索到知识';
  },1400);
}

/* ═══════════════ 对话功能 ═══════════════ */
function sendChat(){
  var input=document.getElementById('chat-input');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  var msgs=document.getElementById('chat-messages');
  var userMsg=document.createElement('div');
  userMsg.className='chat-msg user';
  userMsg.innerHTML='<div class="chat-bubble">'+escHtml(text)+'</div><div class="chat-meta">你 · '+nowStr()+'</div>';
  msgs.appendChild(userMsg);
  msgs.scrollTop=msgs.scrollHeight;

  var typing=document.createElement('div');
  typing.className='chat-msg agent';
  typing.innerHTML='<div class="chat-typing"><span></span><span></span><span></span></div>';
  msgs.appendChild(typing);
  msgs.scrollTop=msgs.scrollHeight;

  var npc=getNPC(selectedNPC)||NPC_LIST[0];
  setTimeout(function(){
    typing.remove();
    var docs=retrieveKnowledge(text,3);
    var isRag=docs.length>0;
    var response=isRag?generateRAGResponse(npc,text,docs.map(function(d){return d.entry;})):generatePureRoleResponse(npc,text);
    var agentMsg=document.createElement('div');
    agentMsg.className='chat-msg agent';
    var ragNote='';
    if(isRag){
      var npcHits=docs.filter(function(d){return d.isNpc;}).length;
      var srcNames=docs.map(function(d){
        var foundOwner='';
        for(var k in NPC_KB){
          var found=NPC_KB[k].find(function(n){return n.id===d.entry.id;});
          if(found){foundOwner=getNPC(k).name;break;}
        }
        return foundOwner?foundOwner+'手记':d.entry.source;
      }).join(', ');
      ragNote='<div class="chat-rag-indicator"><span class="rag-dot"></span>RAG · '+docs.length+' 条（'+npcHits+' 条专属）· '+srcNames+'</div>';
    }
    agentMsg.innerHTML='<div class="chat-agent-avatar">'+npc.icon+'</div><div class="chat-bubble">'+escHtml(response)+'</div>'+ragNote+'<div class="chat-meta">'+npc.name+' · '+npc.role+' · '+nowStr()+'</div>';
    msgs.appendChild(agentMsg);
    msgs.scrollTop=msgs.scrollHeight;
  },500+Math.random()*600);
}

/* ═══════════════ 粒子背景（§三·D 代码动画） ═══════════════ */
function initParticles(){
  var canvas=document.getElementById('particle-canvas');
  var ctx=canvas.getContext('2d');
  var W,H,particles=[];
  function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
  resize();addEventListener('resize',resize);
  var SEED=42;
  function hash(n){var s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
  for(var i=0;i<60;i++){
    particles.push({
      x:hash(i*SEED)*W,y:hash(i*SEED+0.5)*H,
      vx:(hash(i*SEED+1)-0.5)*0.3,vy:(hash(i*SEED+2)-0.5)*0.3,
      r:hash(i*SEED+3)*2+0.5
    });
  }
  var mouse={x:W/2,y:H/2};
  addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  var t=0;
  (function loop(){
    t++;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      var dx=mouse.x-p.x,dy=mouse.y-p.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      var influence=Math.max(0,1-dist/200)*2;
      p.x-=dx*influence*0.01;p.y-=dy*influence*0.01;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(244,193,90,0.3)';ctx.fill();
      for(var j=i+1;j<particles.length;j++){
        var p2=particles[j];
        var dx2=p.x-p2.x,dy2=p.y-p2.y;
        var d2=Math.sqrt(dx2*dx2+dy2*dy2);
        if(d2<100){
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);
          ctx.strokeStyle='rgba(52,211,153,'+(0.15*(1-d2/100))+')';
          ctx.lineWidth=0.5;ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  })();
}

/* ═══════════════ 光标跟随光晕 ═══════════════ */
function initCursorGlow(){
  var glow=document.getElementById('cursor-glow');
  if(!glow)return;
  var cx=0,cy=0,tx=0,ty=0;
  addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;glow.style.opacity='1';});
  document.addEventListener('mouseleave',function(){glow.style.opacity='0';});
  (function loop(){
    cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
    glow.style.left=cx+'px';glow.style.top=cy+'px';
    requestAnimationFrame(loop);
  })();
}

/* ═══════════════ 磁性按钮（弹簧物理） ═══════════════ */
function initMagneticButtons(){
  var btns=document.querySelectorAll('#search-btn,#compare-toggle,#chat-send-btn');
  for(var i=0;i<btns.length;i++){
    (function(btn){
      btn.addEventListener('mousemove',function(e){
        var rect=btn.getBoundingClientRect();
        var x=e.clientX-rect.left-rect.width/2;
        var y=e.clientY-rect.top-rect.height/2;
        btn.style.transform='translate('+x*.2+'px,'+y*.3+'px) scale(1.03)';
      });
      btn.addEventListener('mouseleave',function(){btn.style.transform='';});
      btn.addEventListener('mousedown',function(){btn.style.transform='scale(.95)';});
      btn.addEventListener('mouseup',function(){btn.style.transform='';});
    })(btns[i]);
  }
}

/* ═══════════════ 对话快捷标签 ═══════════════ */
var QUICK_QUESTIONS=['太极拳怎么练','金创药配方','少林七十二绝技','九阴真经下落','桃花岛在哪','华山论剑经过','村中禁忌','武林大会'];
