<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内部数据库 · ARCHIVE</title>
  <meta name="description" content="内部数据库 · 4卷宗 · 梁梓渤作品集" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0d0a07;
      --ink-2: #14100c;
      --ink-3: #1c1712;
      --parchment: #e8dcc4;
      --parchment-dim: #b8a88c;
      --parchment-mute: #8a7c63;
      --gold: #c9a25e;
      --gold-bright: #e6c887;
      --gold-deep: #9a7a3e;
      --cinnabar: #b5342f;
      --cinnabar-dim: #8e2b27;
      --rule: rgba(201, 162, 94, 0.15);
      --rule-strong: rgba(201, 162, 94, 0.35);
      --font-mono: "JetBrains Mono", "Consolas", monospace;
      --font-song: "Noto Serif SC", "STZhongsong", serif;
      --font-brush: "ZCOOL XiaoWei", "STXingkai", serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
    body {
      font-family: var(--font-song);
      color: var(--parchment-dim);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── 纸纹噪点 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── CRT 扫描线 ── */
    #crt {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s linear;
    }
    #crt.on { opacity: 1; }
    #crt .lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.18) 0px,
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
    }
    #crt .vig {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.65) 100%);
    }
    #crt .beam {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(230, 200, 135, 0.5), transparent);
      top: 0;
      animation: crt-beam 3s linear infinite;
    }
    @keyframes crt-beam { from { top: -3px; } to { top: 100%; } }

    /* ── 开机画面 ── */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #050302;
      display: grid;
      place-items: center;
      transition: opacity .9s var(--ease), visibility .9s;
    }
    #boot.done { opacity: 0; visibility: hidden; }

    .boot-crt {
      width: min(720px, 80vw);
      aspect-ratio: 4 / 3;
      position: relative;
      border-radius: 12px;
      background: #000;
      box-shadow:
        inset 0 0 100px rgba(0,0,0,0.92),
        0 0 0 5px #1a140e,
        0 0 0 7px rgba(201,162,94,0.12),
        0 24px 80px rgba(0,0,0,0.85);
      overflow: hidden;
      opacity: 0;
    }
    .boot-crt.lit { animation: tube-on .6s var(--ease) forwards; }
    @keyframes tube-on {
      0% { opacity: 0; transform: scale(0.98); filter: brightness(0); }
      35% { opacity: 1; filter: brightness(2.8); }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }
    .boot-crt .scanline {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, rgba(201,162,94,0.06), transparent 72%);
    }
    .boot-crt .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 30px;
    }
    .boot-crt .logo {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.38em;
      color: var(--gold-deep);
      text-transform: uppercase;
      opacity: 0;
    }
    .boot-crt .logo.show { animation: f-in .6s var(--ease) forwards; }
    .boot-crt .title {
      font-family: var(--font-brush);
      font-size: clamp(28px, 4.5vw, 56px);
      color: var(--parchment);
      letter-spacing: 0.12em;
      line-height: 1.2;
      opacity: 0;
      text-shadow: 0 0 32px rgba(201,162,94,0.45);
    }
    .boot-crt .title .gold {
      background: linear-gradient(120deg, #d9b877 0%, #f0d9a4 40%, #c9a25e 70%, #a8833f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .boot-crt .title.show { animation: title-in .9s var(--ease) forwards; }
    @keyframes title-in {
      from { opacity: 0; letter-spacing: 0.4em; filter: blur(8px); }
      to { opacity: 1; letter-spacing: 0.12em; filter: blur(0); }
    }
    .boot-crt .subtitle {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.4em;
      color: var(--gold-deep);
      text-transform: uppercase;
      opacity: 0;
    }
    .boot-crt .subtitle.show { animation: f-in .7s var(--ease) forwards; }
    @keyframes f-in { to { opacity: 1; } }
    .boot-crt .crosshair {
      width: 72px; height: 72px;
      border: 1.5px solid rgba(201,162,94,0.45);
      border-radius: 50%;
      position: relative;
      margin-bottom: 8px;
      opacity: 0;
      transform: scale(0.5);
    }
    .boot-crt .crosshair.show { animation: cross-in .55s var(--ease) forwards; }
    @keyframes cross-in { to { opacity: 1; transform: scale(1); } }
    .boot-crt .crosshair::before, .boot-crt .crosshair::after {
      content: '';
      position: absolute;
      background: var(--gold);
    }
    .boot-crt .crosshair::before {
      width: 36px; height: 1.5px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .boot-crt .crosshair::after {
      width: 1.5px; height: 36px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .boot-crt .status-bar {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--parchment-mute);
      text-transform: uppercase;
    }
    .boot-crt .status-bar .dot { color: var(--cinnabar); animation: blink 1.2s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── 主档案视图 ── */
    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity .8s var(--ease);
      pointer-events: none;
    }
    #app.on { opacity: 1; pointer-events: auto; }

    /* ── 顶部标题栏 ── */
    #topbar {
      padding: 20px 32px 14px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    #topbar .brand {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.36em;
      color: var(--gold-deep);
      text-transform: uppercase;
      white-space: nowrap;
    }
    #topbar .divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--rule-strong), transparent);
    }
    #topbar .info {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--parchment-mute);
      white-space: nowrap;
    }
    #topbar .info b { color: var(--gold-bright); font-weight: 700; }
    #topbar .info .red { color: var(--cinnabar); }

    /* ── 档案主体 ── */
    #archive-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 列区 */
    #columns {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border-right: 1px solid var(--rule);
      padding: 20px 16px;
      gap: 12px;
    }
    .column:last-child { border-right: none; }
    .column-header {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-deep);
      padding: 6px 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .column-header::before {
      content: '◆';
      font-size: 7px;
      color: var(--cinnabar);
    }

    /* ── 档案卡片 ── */
    .archive-card {
      position: relative;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: linear-gradient(160deg, var(--ink-3), var(--ink-2));
      padding: 16px 18px;
      cursor: pointer;
      transition: all .28s var(--ease);
      overflow: hidden;
    }
    .archive-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(201,162,94,0.04), transparent 60%);
      pointer-events: none;
    }
    .archive-card:hover {
      border-color: var(--rule-strong);
      background: linear-gradient(160deg, var(--ink-2), var(--ink));
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--rule-strong);
    }
    .archive-card.active {
      border-color: var(--gold);
      background: linear-gradient(160deg, rgba(201,162,94,0.1), var(--ink-2));
      box-shadow: 0 0 0 1px var(--gold), 0 8px 40px rgba(201,162,94,0.12);
    }
    .archive-card.active::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--gold);
      border-radius: 6px 0 0 6px;
    }

    /* 编号 + 封印 */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-no {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--gold-deep);
      text-transform: uppercase;
    }
    .card-seal {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--parchment-mute);
    }
    .card-seal .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cinnabar);
      box-shadow: 0 0 6px rgba(181,52,47,0.5);
    }
    .card-title {
      font-family: var(--font-brush);
      font-size: 22px;
      font-weight: 400;
      color: var(--parchment);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .card-title-en {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.24em;
      color: var(--parchment-mute);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--gold);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 2px 8px;
      margin-bottom: 10px;
      background: rgba(201,162,94,0.05);
    }
    .card-summary {
      font-size: 12px;
      line-height: 1.75;
      color: var(--parchment-mute);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 底部指标 */
    .card-meta {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }
    .card-metric {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--parchment-mute);
    }
    .card-metric span {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1.1;
      margin-bottom: 2px;
    }

    /* ── 右侧面板（选中详情预览） ── */
    #preview-panel {
      width: 380px;
      flex-shrink: 0;
      border-left: 1px solid var(--rule);
      background: var(--ink-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-header .label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-deep);
    }
    .preview-header .no {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cinnabar);
      letter-spacing: 0.16em;
    }
    .preview-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .preview-body .p-title {
      font-family: var(--font-brush);
      font-size: 32px;
      color: var(--parchment);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .preview-body .p-en {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--parchment-mute);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .preview-body .p-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--gold);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 16px;
    }
    .preview-body .p-desc {
      font-size: 12.5px;
      line-height: 1.85;
      color: var(--parchment-dim);
      margin-bottom: 20px;
    }
    .preview-body .p-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 20px;
    }
    .preview-body .p-tech span {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--parchment-dim);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 3px 9px;
      background: rgba(201,162,94,0.04);
    }
    .preview-body .p-section-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 10px;
    }
    .preview-body .p-highlight {
      font-size: 12px;
      line-height: 1.75;
      color: var(--parchment-mute);
      padding-left: 12px;
      border-left: 2px solid var(--cinnabar);
      margin-bottom: 20px;
    }
    .preview-body .p-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .preview-body .p-metric {
      background: rgba(201,162,94,0.05);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 8px 10px;
    }
    .preview-body .p-metric .mv {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1.1;
    }
    .preview-body .p-metric .ml {
      font-size: 9px;
      color: var(--parchment-mute);
      margin-top: 3px;
      line-height: 1.3;
    }
    .preview-body .p-detail-list {
      margin-bottom: 20px;
    }
    .preview-body .p-detail-item {
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(6px);
    }
    .preview-body .p-detail-item.show {
      animation: detail-item-in .35s var(--ease) forwards;
    }
    @keyframes detail-item-in {
      to { opacity: 1; transform: translateY(0); }
    }
    .preview-body .p-detail-item .dh {
      font-family: var(--font-song);
      font-size: 12px;
      font-weight: 700;
      color: var(--parchment);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preview-body .p-detail-item .dh::before {
      content: '▸';
      color: var(--cinnabar);
      font-size: 10px;
    }
    .preview-body .p-detail-item .dp {
      font-size: 11.5px;
      line-height: 1.8;
      color: var(--parchment-mute);
      padding-left: 12px;
      border-left: 1px solid var(--rule);
    }
    .preview-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 10px;
    }
    .preview-footer .btn-open {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-bright);
      background: rgba(201,162,94,0.08);
      border: 1px solid var(--rule-strong);
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all .22s var(--ease);
    }
    .preview-footer .btn-open:hover {
      background: rgba(201,162,94,0.16);
      border-color: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(201,162,94,0.15);
    }
    .preview-footer .btn-nav {
      width: 38px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--parchment-mute);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 6px;
      cursor: pointer;
      transition: all .2s var(--ease);
      flex-shrink: 0;
    }
    .preview-footer .btn-nav:hover {
      color: var(--gold-bright);
      border-color: var(--rule-strong);
    }

    /* ── 底部状态栏 ── */
    #bottombar {
      padding: 10px 32px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--ink-2);
    }
    #bottombar .hint {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--parchment-mute);
    }
    #bottombar .hint kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      color: var(--gold-deep);
      margin: 0 3px;
      font-family: inherit;
      font-size: 9px;
    }
    #bottombar .session {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--parchment-mute);
    }
    #bottombar .session .time { color: var(--gold-deep); }

    /* ── 全屏详情页 ── */
    #detail {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(8, 6, 4, 0.95);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .4s var(--ease), visibility .4s;
    }
    #detail.on { opacity: 1; visibility: visible; pointer-events: auto; }
    #detail .panel {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* 顶部 */
    #detail .detail-top {
      padding: 18px 32px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 16, 12, 0.7);
    }
    #detail .detail-top .no {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--cinnabar);
      text-transform: uppercase;
    }
    #detail .detail-top .sep { color: var(--parchment-mute); font-size: 11px; }
    #detail .detail-top .name {
      font-family: var(--font-brush);
      font-size: 24px;
      color: var(--parchment);
      letter-spacing: 0.06em;
    }
    #detail .detail-top .tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--gold);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      padding: 3px 12px;
      margin-left: auto;
    }
    #detail .detail-top .btn-close {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--parchment-mute);
