<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="minimum-width" content="1024" />
  <title>内部数据库 · 3D 档案柜</title>
  <meta name="description" content="3D 档案柜：算法引擎 / AI 系统 / 质量守卫，四卷宗待阅。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* ── 古卷色彩（与 06_portfolio 保持一致） ── */
      --ink: #14100c;
      --ink-2: #1c1712;
      --ink-3: #241d15;
      --parchment: #e8dcc4;
      --parchment-dim: #b8a88c;
      --parchment-mute: #8a7c63;
      --gold: #c9a25e;
      --gold-bright: #e6c887;
      --gold-deep: #9a7a3e;
      --cinnabar: #b5342f;
      --cinnabar-dim: #8e2b27;
      --rule: rgba(201, 162, 94, 0.18);
      --rule-strong: rgba(201, 162, 94, 0.38);

      /* ── 字体 ── */
      --brush: "ZCOOL XiaoWei", "STXingkai", "STKaiti", "KaiTi", "楷体", "华文行楷", serif;
      --song: "Noto Serif SC", "STZhongsong", "SimSun", "Songti SC", serif;
      --mono: "JetBrains Mono", "Consolas", "Cascadia Code", monospace;

      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: var(--song);
      background: var(--ink);
      color: var(--parchment-dim);
      min-width: 1024px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 水墨纸纹（沿用古卷风格 SVG noise） ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── 3D 画布 ── */
    #gl {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.4s var(--ease);
    }
    #gl.on { opacity: 1; }

    /* ── 顶部 HUD ── */
    #hud {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 28px;
      opacity: 0;
      transition: opacity .8s var(--ease) .2s;
      pointer-events: none;
    }
    #hud.on { opacity: 1; }
    #hud .mark {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.32em;
      color: var(--gold-deep);
      text-transform: uppercase;
      white-space: nowrap;
    }
    #hud .rod {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--rule-strong));
    }
    #hud .state {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--parchment-mute);
      white-space: nowrap;
    }
    #hud .state b {
      color: var(--gold-bright);
      font-weight: 700;
    }
    #hud .state .cinnabar { color: var(--cinnabar); }

    /* ── CRT 扫描线层 ── */
    #crt {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s linear;
    }
    #crt.on { opacity: 1; }
    #crt .lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
    }
    #crt .beam {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(230, 200, 135, 0.9), transparent);
      box-shadow: 0 0 24px 6px rgba(230, 200, 135, 0.35);
      top: 0;
      animation: crt-beam 2.2s linear infinite;
    }
    @keyframes crt-beam {
      from { top: -2px; }
      to { top: 100%; }
    }
    #crt .vig {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* ── CRT 开机动画层 ── */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #050302;
      display: grid;
      place-items: center;
      transition: opacity 1s var(--ease), visibility 1s;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .tube {
      width: min(760px, 72vw);
      aspect-ratio: 4 / 3;
      position: relative;
      border-radius: 14px;
      background: #000;
      box-shadow:
        inset 0 0 80px rgba(0, 0, 0, 0.9),
        0 0 0 6px #1a140e,
        0 0 0 8px rgba(201, 162, 94, 0.14),
        0 30px 90px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      opacity: 0;
    }
    #boot .tube.lit { animation: tube-on .5s var(--ease) forwards; }
    @keyframes tube-on {
      0% { opacity: 0; transform: scale(0.985); filter: brightness(0); }
      40% { opacity: 1; filter: brightness(2.4); }
      100% { opacity: 1; transform: scale(1); filter: brightness(1); }
    }
    #boot .tube .scan {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, rgba(201, 162, 94, 0.07), transparent 70%);
    }
    #boot .tube .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
    }
    #boot .tube .cross {
      width: 84px;
      height: 84px;
      border: 1.5px solid rgba(201, 162, 94, 0.5);
      border-radius: 50%;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.6);
    }
    #boot .tube .cross i {
      display: block;
      width: 44px;
      height: 1.5px;
      background: var(--gold);
      position: relative;
    }
    #boot .tube .cross i::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 1.5px;
      height: 44px;
      left: 50%;
      top: -22px;
      background: var(--gold);
    }
    #boot .tube .cross.show { animation: cross-in .6s var(--ease) forwards; }
    @keyframes cross-in {
      to { opacity: 1; transform: scale(1); }
    }
    #boot .tube .name {
      font-family: var(--brush);
      font-size: clamp(30px, 4.4vw, 52px);
      color: var(--parchment);
      letter-spacing: 0.14em;
      opacity: 0;
      text-shadow: 0 0 24px rgba(201, 162, 94, 0.5);
    }
    #boot .tube .name .gold {
      background: linear-gradient(120deg, #d9b877 0%, #f0d9a4 42%, #c9a25e 72%, #a8833f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    #boot .tube .name.show { animation: name-in .8s var(--ease) forwards; }
    @keyframes name-in {
      from { opacity: 0; letter-spacing: 0.5em; filter: blur(6px); }
      to { opacity: 1; letter-spacing: 0.14em; filter: blur(0); }
    }
    #boot .tube .sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4em;
      color: var(--gold-deep);
      text-transform: uppercase;
      opacity: 0;
    }
    #boot .tube .sub.show { animation: fadein .7s var(--ease) forwards; }
    @keyframes fadein { to { opacity: 1; } }
    #boot .cap {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--parchment-mute);
      text-transform: uppercase;
    }
    #boot .cap .dot { color: var(--cinnabar); }

    /* ── 全屏灯箱（详情页） ── */
    #detail {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(10, 8, 5, 0.92);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s var(--ease), visibility .45s;
    }
    #detail.on { opacity: 1; visibility: visible; }
    #detail .panel {
      position: absolute;
      inset: 4vh 5vw;
      display: grid;
      grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr) auto;
      gap: 0;
      border: 1px solid var(--rule-strong);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(165deg, var(--ink-2), var(--ink));
      transform: translateY(14px) scale(0.985);
      transition: transform .45s var(--ease);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
    }
    #detail.on .panel { transform: translateY(0) scale(1); }

    /* 主视觉区（舞台，全宽铺满，作为详情页主体） */
    #detail .stage {
      grid-row: 1;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at center, rgba(201, 162, 94, 0.07), transparent 68%),
        #0b0806;
      overflow: hidden;
    }
    #detail .stage .fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }
    #detail .stage .fallback .glyph {
      font-family: var(--brush);
      font-size: clamp(72px, 12vh, 150px);
      color: var(--gold-deep);
      opacity: 0.6;
      line-height: 1;
      text-shadow: 0 0 60px rgba(201, 162, 94, 0.35);
    }
    #detail .stage .fallback .label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.32em;
      color: var(--parchment-mute);
      text-transform: uppercase;
      margin-top: 22px;
    }

    /* 详情要点区（位于主视觉下方） */
    #detail .meta {
      grid-row: 2;
      padding: 24px 30px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 0 36px;
      overflow-y: auto;
    }
    #detail .meta .meta-main {
      padding-right: 28px;
      border-right: 1px solid var(--rule);
    }
    #detail .meta .no {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--cinnabar);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }
    #detail .meta .no::before {
      content: '';
      width: 18px; height: 1px;
      background: var(--cinnabar);
    }
    #detail .meta h2 {
      font-family: var(--brush);
      font-size: 38px;
      font-weight: 400;
      color: var(--parchment);
      letter-spacing: 0.04em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    #detail .meta .sub {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--gold-deep);
      margin-bottom: 20px;
    }
    #detail .meta .cat {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 22px;
      align-self: flex-start;
    }
    #detail .meta .desc {
      font-size: 13.5px;
      line-height: 1.85;
      color: var(--parchment-mute);
      margin-bottom: 24px;
    }
    #detail .meta .desc strong { color: var(--parchment-dim); }
    #detail .meta .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
    }
    #detail .meta .stack span {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: var(--parchment-dim);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 4px 10px;
      background: rgba(201, 162, 94, 0.05);
    }
    #detail .meta .hls { margin-bottom: 24px; }
    #detail .meta .meta-side h3, #detail .meta .meta-main .hls h3 {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      color: var(--gold-deep);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 500;
    }
    #detail .meta .hls li {
      list-style: none;
      position: relative;
      padding: 7px 0 7px 18px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--parchment-mute);
      border-bottom: 1px dashed rgba(201, 162, 94, 0.1);
    }
    #detail .meta .hls li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--cinnabar);
      font-size: 11px;
    }
    #detail .meta .meta-side {
      padding-left: 28px;
      border-left: 1px solid var(--rule);
    }
    #detail .meta .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #detail .meta .metrics .m {
      background: rgba(201, 162, 94, 0.05);
      border: 1px solid var(--rule);
      border-radius: 7px;
      padding: 10px;
    }
    #detail .meta .metrics .mv {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--gold-bright);
      line-height: 1.2;
    }
    #detail .meta .metrics .ml {
      font-size: 10px;
      color: var(--parchment-mute);
      margin-top: 4px;
      line-height: 1.4;
    }

    #detail .stage {
      position: relative;
      display: grid;
      place-items: center;
      background: #0b0806;
      overflow: hidden;
    }
    #detail .stage .media-wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 34px;
    }
    #detail .stage video, #detail .stage img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      border: 1px solid var(--rule);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      background: #000;
      object-fit: contain;
    }
    #detail .stage .fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }
    #detail .stage .fallback .glyph {
      font-family: var(--brush);
      font-size: 88px;
      color: var(--gold-deep);
      opacity: 0.55;
      line-height: 1;
      text-shadow: 0 0 40px rgba(201, 162, 94, 0.3);
    }
    #detail .stage .fallback .label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--parchment-mute);
      text-transform: uppercase;
      margin-top: 18px;
    }
    #detail .stage .cap {
      position: absolute;
      left: 14px; bottom: 12px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: rgba(232, 220, 196, 0.75);
      background: rgba(20, 16, 12, 0.7);
      padding: 4px 9px;
      border-radius: 5px;
      backdrop-filter: blur(3px);
    }

    #detail .bar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-top: 1px solid var(--rule);
      background: rgba(20, 16, 12, 0.6);
    }
    #detail .bar .hint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--parchment-mute);
      text-transform: uppercase;
      margin-right: auto;
    }
    #detail .bar .hint kbd {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--gold-deep);
      margin: 0 4px;
      font-family: inherit;
    }
    #detail .bar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.05em;
      color: var(--gold-bright);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--rule-strong);
      border-radius: 8px;
      background: rgba(201, 162, 94, 0.06);
      transition: all .25s var(--ease);
      white-space: nowrap;
    }
    #detail .bar a:hover {
      background: rgba(201, 162, 94, 0.14);
      border-color: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(201, 162, 94, 0.16);
    }
    #detail .bar a .ico { flex-shrink: 0; }

    /* ── 灯箱内 3 列分类指示 ── */
    #detail .bar .col-dots {
      display: flex;
      gap: 6px;
      margin-left: auto;
      margin-right: 12px;
    }
    #detail .bar .col-dots i {
      width: 22px; height: 3px;
      border-radius: 2px;
      background: var(--rule);
    }
    /* ── 屏幕左右方向键（常驻） ── */
    #nav-prev, #nav-next {
      position: fixed;
      top: 50%;
      z-index: 30;
      width: 58px;
      height: 58px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 22px;
      color: var(--gold-bright);
      background: rgba(20, 16, 12, 0.55);
      border: 1px solid var(--rule-strong);
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all .25s var(--ease);
      opacity: 0;
      pointer-events: none;
    }
    #hud.on ~ #nav-prev, #hud.on ~ #nav-next {
      opacity: 1;
      pointer-events: auto;
    }
    #nav-prev { left: 26px; }
    #nav-next { right: 26px; }
    #nav-prev:hover, #nav-next:hover {
      background: rgba(201, 162, 94, 0.14);
      border-color: var(--gold);
      transform: translateY(-50%) scale(1.06);
      box-shadow: 0 6px 20px rgba(201, 162, 94, 0.18);
    }
    #nav-prev:focus-visible, #nav-next:focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 3px;
    }

    /* ── 详情页栏：翻页 + 链接 ── */
    #detail .bar .bar-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
    }
    #detail .bar .bar-nav button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 15px;
      color: var(--gold-bright);
      background: transparent;
      border: 1px solid var(--rule-strong);
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s var(--ease);
    }
    #detail .bar .bar-nav button:hover {
      background: rgba(201, 162, 94, 0.12);
      border-color: var(--gold);
    }
    #detail .bar .bar-nav .pos {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--parchment-mute);
      min-width: 46px;
      text-align: center;
    }
    #detail .bar .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--rule-strong);
      border-radius: 4px;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DoPE7Teg.js"></script>
</head>
<body>

  <!-- 3D 画布 -->
  <canvas id="gl"></canvas>

  <!-- 顶部 HUD -->
  <header id="hud">
    <span class="mark">内部数据库 · Internal Archive</span>
    <span class="rod"></span>
    <span class="state" id="hud-state">
      <b id="hud-no">001</b>
      <span id="hud-title"> 灵魂工坊</span>
      <span class="cinnabar"> · </span>
      <span id="hud-pos">1 / 4</span>
    </span>
    <span class="rod"></span>
    <span class="mark">Internal Archive · 2026</span>
  </header>

  <!-- 屏幕左右方向键（常驻，开机后随 HUD 淡入） -->
  <button id="nav-prev" type="button" aria-label="上一卷">←</button>
  <button id="nav-next" type="button" aria-label="下一卷">→</button>

  <!-- CRT 扫描线（常驻，开机后淡入） -->
  <div id="crt">
    <div class="lines"></div>
    <div class="beam"></div>
    <div class="vig"></div>
  </div>

  <!-- CRT 开机动画 -->
  <div id="boot" aria-hidden="true">
    <div class="tube" id="tube">
      <div class="scan"></div>
      <div class="center">
        <div class="cross" id="cross"><i></i></div>
        <div class="sub" id="boot-sub">内部数据库 · INTERNAL DATABASE</div>
      </div>
