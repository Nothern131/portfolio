<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio · 项目展示</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0E14;color:#E8E6E3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:48px 24px}
.header{margin-bottom:48px}
.header h1{font-size:28px;color:#f0b958;font-weight:700;margin-bottom:8px}
.header p{font-size:14px;color:#6B7280}
.card{background:#11151D;border:1px solid #1E2430;border-radius:12px;padding:24px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:#f0b958}
.card h2{font-size:16px;color:#E8E6E3;margin-bottom:8px}
.card .desc{font-size:13px;color:#6B7280;line-height:1.6;margin-bottom:16px}
.card .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.card .tag{font-size:10px;padding:3px 8px;border-radius:4px;background:rgba(240,185,88,.08);color:#f0b958}
.card a{display:inline-block;font-size:13px;color:#60a5fa;text-decoration:none;padding:8px 16px;border:1px solid rgba(96,165,250,.3);border-radius:6px;transition:all .2s}
.card a:hover{background:rgba(96,165,250,.08);border-color:#60a5fa}
.card a+a{margin-left:8px}
.footer{margin-top:48px;text-align:center;font-size:12px;color:#3D4450}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Portfolio</h1>
    <p>项目展示与在线体验</p>
  </div>

  <div class="card">
    <h2>灵魂工坊 · Soul Workshop v4</h2>
    <p class="desc">NPC 意识引擎完整系统。包含 10 维性格参数、语义理解管线、心口不一算法、冷热记忆系统、自主行为调度器。纯前端 4000+ 行 GDScript 逻辑全部在浏览器中运行。</p>
    <div class="tags">
      <span class="tag">AI Agent</span>
      <span class="tag">意识引擎</span>
      <span class="tag">NPC 系统</span>
      <span class="tag">语义理解</span>
      <span class="tag">纯前端</span>
    </div>
    <a href="soul-workshop/">在线体验</a>
  </div>

  <div class="footer">
    <p>更多项目即将上线</p>
  </div>
</div>
</body>
</html>
