<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>冷热记忆提炼 · 记忆系统演示</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0E14;color:#E8E6E3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden;user-select:none}
.app{display:flex;height:100vh}
.sidebar{width:260px;min-width:260px;background:#11151D;border-right:1px solid #1E2430;display:flex;flex-direction:column;overflow-y:auto}
.sidebar-header{padding:16px;border-bottom:1px solid #1E2430}
.sidebar-header h2{font-size:14px;color:#4ade80;font-weight:600}
.sidebar-header .desc{font-size:10px;color:#6B7280;margin-top:4px}
.npc-list{flex:1;overflow-y:auto;padding:8px}
.npc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .2s;margin-bottom:4px;position:relative}
.npc-item:hover{background:#1A1D27}
.npc-item.active{border-color:#4ade80;background:rgba(74,222,128,.08)}
.npc-item .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.npc-item .info{flex:1;min-width:0}
.npc-item .info .name{font-size:13px;font-weight:600}
.npc-item .info .role{font-size:10px;color:#6B7280}
.npc-item .mem-count{font-size:10px;color:#4ade80;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 20px;border-bottom:1px solid #1E2430;display:flex;align-items:center;gap:12px}
.main-header h3{font-size:14px;color:#E8E6E3;font-weight:600}
.main-header .tick{font-size:11px;color:#4ade80;font-family:monospace;margin-left:auto}
.panels{flex:1;display:flex;overflow:hidden}
/* 左：记忆漏斗可视化 */
.funnel-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid #1E2430;overflow-y:auto;padding:16px}
.funnel-title{font-size:12px;color:#6B7280;margin-bottom:12px;font-weight:600}
.funnel-layer{background:#11151D;border:1px solid #1E2430;border-radius:8px;padding:12px;margin-bottom:12px}
.funnel-layer h4{font-size:11px;color:#4ade80;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.funnel-layer h4 .count{font-size:10px;color:#6B7280;margin-left:auto}
.mem-item{font-size:11px;padding:4px 8px;margin:3px 0;border-radius:4px;background:rgba(74,222,128,.04);border:1px solid transparent;transition:all .3s}
.mem-item.new{animation:slideIn .3s ease}
.mem-item.positive{border-color:rgba(74,222,128,.2)}
.mem-item.negative{border-color:rgba(248,113,113,.2)}
.mem-item .tag{font-size:9px;padding:1px 5px;border-radius:3px;margin-right:4px}
.mem-item .tag.positive{background:rgba(74,222,128,.15);color:#4ade80}
.mem-item .tag.negative{background:rgba(248,113,113,.15);color:#f87171}
.mem-item .tag.abstract{background:rgba(192,132,252,.15);color:#c084fc}
.mem-item .age{font-size:9px;color:#6B7280;float:right}
.mem-item .confidence{font-size:9px;color:#c084fc;float:right;margin-left:6px}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
/* 右：事件注入+日志 */
.right-panel{width:380px;min-width:380px;display:flex;flex-direction:column;overflow:hidden}
.event-inject{background:#11151D;border-bottom:1px solid #1E2430;padding:16px}
.event-inject label{font-size:11px;color:#6B7280;display:block;margin-bottom:8px}
.event-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.event-preset{padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #1E2430;background:#11151D;color:#E8E6E3;transition:all .2s}
.event-preset:hover{border-color:#4ade80;background:rgba(74,222,128,.04)}
.event-preset.active{border-color:#4ade80;background:rgba(74,222,128,.08);color:#4ade80}
.inject-row{display:flex;gap:8px}
.inject-row input{flex:1;background:#0B0E14;border:1px solid #1E2430;border-radius:6px;padding:8px 12px;font-size:12px;color:#E8E6E3;outline:none}
.inject-row input:focus{border-color:#4ade80}
.inject-row button{padding:8px 16px;background:#4ade80;color:#0B0E14;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.inject-row button:hover{opacity:.9}
.log-panel{flex:1;overflow-y:auto;padding:16px;background:#0B0E14}
.log-panel h4{font-size:11px;color:#6B7280;margin-bottom:8px}
.log-entry{font-size:11px;padding:6px 8px;margin:4px 0;border-radius:4px;background:#11151D;border-left:2px solid transparent;animation:slideIn .3s ease}
.log-entry.consolidate{border-left-color:#c084fc}
.log-entry.prune{border-left-color:#f87171}
.log-entry.recall{border-left-color:#60a5fa}
.log-entry.drive{border-left-color:#ffa84d}
.log-entry .log-tag{font-size:9px;padding:1px 5px;border-radius:3px;margin-right:4px}
.log-entry .log-tag.consolidate{background:rgba(192,132,252,.15);color:#c084fc}
.log-entry .log-tag.prune{background:rgba(248,113,113,.15);color:#f87171}
.log-entry .log-tag.recall{background:rgba(96,165,250,.15);color:#60a5fa}
.log-entry .log-tag.drive{background:rgba(255,168,77,.15);color:#ffa84d}
/* 漏斗动画 */
.funnel-arrow{text-align:center;color:#1E2430;font-size:18px;margin:-8px 0}
.stats-bar{display:flex;gap:16px;padding:8px 16px;background:#11151D;border-bottom:1px solid #1E2430;font-size:11px}
.stat{display:flex;align-items:center;gap:4px}
.stat .label{color:#6B7280}
.stat .value{color:#E8E6E3;font-family:monospace}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="sidebar-header">
    <h2>记忆漏斗 v2</h2>
    <div class="desc">冷热记忆提炼 · 选择一个NPC</div>
  </div>
  <div class="npc-list" id="npcList"></div>
</div>
<div class="main">
  <div class="main-header">
    <h3 id="panelTitle">选择一个NPC查看记忆系统</h3>
    <div class="tick">Tick: <span id="tickCount">0</span></div>
  </div>
  <div class="stats-bar">
    <div class="stat"><span class="label">原始记忆</span>: <span class="value" id="statRaw">0</span></div>
    <div class="stat"><span class="label">抽象印象</span>: <span class="value" id="statAbstract">0</span></div>
    <div class="stat"><span class="label">内存占用</span>: <span class="value" id="statMem">0 KB</span></div>
    <div class="stat"><span class="label">记忆驱动</span>: <span class="value" id="statDriven">0</span></div>
  </div>
  <div class="panels">
    <div class="funnel-panel" id="funnelPanel">
      <div class="funnel-title">记忆漏斗 — 原始事件 → 情感标签 → 抽象印象</div>
      <div id="funnelContent"></div>
    </div>
    <div class="right-panel">
      <div class="event-inject">
        <label>环境注入 — 事件会写入NPC记忆</label>
        <div class="event-presets" id="eventPresets"></div>
        <div class="inject-row">
          <input type="text" id="customEvent" placeholder="自定义事件，如：阿福偷了云溪的钱袋" />
          <button onclick="injectEvent()">注入</button>
        </div>
      </div>
      <div class="log-panel" id="logPanel">
        <h4>系统日志</h4>
        <div id="logContent"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// ═══════════════ NPC 数据 ═══════════════
var NPCS=[
  {id:'A',name:'云溪',role:'侠客',avatar:'⚔',color:'#60a5fa',personality:{正义:92,勇敢:85,沉默:75,贪婪:8,善良:78},memories:[],abstractMemory:[],mood:'neutral'},
  {id:'B',name:'阿福',role:'村民',avatar:'🍞',color:'#f0b958',personality:{正义:45,勇敢:28,沉默:20,贪婪:68,善良:55},memories:[],abstractMemory:[],mood:'neutral'},
  {id:'C',name:'小翠',role:'少女',avatar:'🌸',color:'#4ade80',personality:{正义:60,勇敢:35,沉默:45,贪婪:12,善良:88},memories:[],abstractMemory:[],mood:'neutral'},
  {id:'D',name:'老村长',role:'村长',avatar:'🏮',color:'#ffa84d',personality:{正义:78,勇敢:55,沉默:50,贪婪:22,善良:72},memories:[],abstractMemory:[],mood:'neutral'},
  {id:'E',name:'书生',role:'书生',avatar:'📜',color:'#c084fc',personality:{正义:55,勇敢:20,沉默:65,贪婪:15,善良:65},memories:[],abstractMemory:[],mood:'neutral'}
];
var selectedNpc=null;
var engineTick=0;
var tickInterval=null;

// 预设事件
var presetEvents=[
  {text:'阿福在井边帮老村长打水',pos:1,imp:30},
  {text:'云溪在村口帮小翠赶走了野狗',pos:1,imp:55},
  {text:'阿福偷了云溪的钱袋',pos:-1,imp:70},
  {text:'书生在茶馆讲了个笑话，大家都很开心',pos:1,imp:25},
  {text:'老村长帮阿福修好了铁匠铺的炉子',pos:1,imp:40},
  {text:'云溪在祠堂前救了摔倒的小翠',pos:1,imp:60},
  {text:'阿福说谎被老村长当众揭穿',pos:-1,imp:65},
  {text:'书生在村口偷了老村长的酒',pos:-1,imp:55},
  {text:'小翠帮书生找到了丢失的书',pos:1,imp:35},
  {text:'云溪和阿福因为钱的事在井边大吵',pos:-1,imp:80},
  {text:'老村长在祠堂开会，表扬了云溪',pos:1,imp:45},
  {text:'阿福在茶馆对书生恶语相向',pos:-1,imp:50},
  {text:'小翠在田埂上帮老村长收庄稼',pos:1,imp:30},
  {text:'书生在河边帮云溪包扎伤口',pos:1,imp:50},
  {text:'阿福在村外欺负小翠',pos:-1,imp:75}
];

// ═══════════════ 渲染 ═══════════════
function renderNPCList(){
  var html='';
  NPCS.forEach(function(n){
    var cls=n===selectedNpc?'active':'';
    html+='<div class="npc-item '+cls+'" onclick="selectNPC(\''+n.id+'\')">';
    html+='<div class="avatar" style="background:rgba('+hexToRgb(n.color)+',.15)">'+n.avatar+'</div>';
    html+='<div class="info"><div class="name">'+n.name+'</div><div class="role">'+n.role+' · 原始'+n.memories.length+'条</div></div>';
    html+='<div class="mem-count">'+n.memories.length+'条</div>';
    html+='</div>';
  });
  document.getElementById('npcList').innerHTML=html;
}

function renderEventPresets(){
  var html='';
  presetEvents.forEach(function(p,i){
    html+='<div class="event-preset" onclick="quickInject('+i+')">'+p.text+'</div>';
  });
  document.getElementById('eventPresets').innerHTML=html;
}

function hexToRgb(hex){var r=parseInt(hex.slice(1,3),16);var g=parseInt(hex.slice(3,5),16);var b=parseInt(hex.slice(5,7),16);return r+','+g+','+b;}

function selectNPC(id){
  var npc=NPCS.find(function(n){return n.id===id;});
  if(!npc)return;
  selectedNpc=npc;
  renderNPCList();
  renderFunnel();
  document.getElementById('panelTitle').innerHTML=npc.name+' — 记忆系统';
  updateStats();
}

function renderFunnel(){
  if(!selectedNpc){document.getElementById('funnelContent').innerHTML='<div style="color:#6B7280;font-size:12px;text-align:center;padding:40px">选择一个NPC查看记忆漏斗</div>';return;}
  var npc=selectedNpc;
  var html='';

  // 第1层：原始记忆
  html+='<div class="funnel-layer"><h4>原始记忆 ('+npc.memories.length+'条) <span class="count">容量: 20条</span></h4>';
  var shown=npc.memories.slice().reverse().slice(0,8);
  shown.forEach(function(m){
    var cls=m.em>0?'positive':'negative';
    var tag=m.em>0?'<span class="tag positive">+</span>':'<span class="tag negative">-</span>';
    var age=engineTick-m.t;
    var ageStr=age===0?'刚刚':age+'tick前';
    html+='<div class="mem-item '+cls+'">'+tag+m.text+'<span class="age">'+ageStr+'</span></div>';
  });
  if(npc.memories.length>8)html+='<div class="mem-item" style="color:#6B7280">...还有'+(npc.memories.length-8)+'条更早的记忆</div>';
  html+='</div>';

  // 漏斗箭头
  html+='<div class="funnel-arrow">▼ 每15tick提炼一次 ▼</div>';

  // 第2层：抽象印象
  html+='<div class="funnel-layer"><h4>抽象印象 ('+npc.abstractMemory.length+'条) <span class="count">置信度衰减中</span></h4>';
  if(npc.abstractMemory.length===0){
    html+='<div class="mem-item" style="color:#6B7280">尚未形成抽象印象</div>';
  }else{
    npc.abstractMemory.forEach(function(a){
      var cls=a.valence==='positive'?'positive':a.valence==='negative'?'negative':'';
      var tag=a.valence==='positive'?'<span class="tag positive">信任</span>':a.valence==='negative'?'<span class="tag negative">警惕</span>':'<span class="tag abstract">混合</span>';
      var age=engineTick-a.tick;
      var ageStr=age===0?'刚刚':age+'tick前';
      html+='<div class="mem-item '+cls+'">'+tag+a.text+'<span class="confidence">置信度:'+a.confidence+'%</span><span class="age">'+ageStr+'</span></div>';
    });
    html+='</div>';
  }
  html+='</div>';

  // 漏斗箭头
  html+='<div class="funnel-arrow">▼ 记忆驱动行为 ▼</div>';

  // 第3层：记忆驱动
  html+='<div class="funnel-layer"><h4>记忆驱动目标</h4>';
  var hasDrive=false;
  if(npc.memories.length>0){
    var recent=npc.memories.filter(function(m){return m.imp>40&&(engineTick-m.t)<=10;});
    if(recent.length>0){
      hasDrive=true;
      recent.forEach(function(m){
        html+='<div class="mem-item" style="border-left:2px solid #ffa84d">'+npc.name+'还在想着「'+m.text+'」</div>';
      });
    }
  }
  if(!hasDrive)html+='<div class="mem-item" style="color:#6B7280">暂无记忆驱动目标</div>';
  html+='</div>';

  document.getElementById('funnelContent').innerHTML=html;
}

function addLog(type,tag,text){
  var container=document.getElementById('logContent');
  var div=document.createElement('div');
  div.className='log-entry '+type;
  div.innerHTML='<span class="log-tag '+type+'">'+tag+'</span>'+text;
  container.insertBefore(div,container.firstChild);
  if(container.children.length>50)container.removeChild(container.lastChild);
}

function updateStats(){
  if(!selectedNpc)return;
  var npc=selectedNpc;
  document.getElementById('statRaw').textContent=npc.memories.length;
  document.getElementById('statAbstract').textContent=npc.abstractMemory.length;
  // 估算内存：每条记忆约200字节，抽象印象约100字节
  var memBytes=npc.memories.length*200+npc.abstractMemory.length*100;
  document.getElementById('statMem').textContent=(memBytes/1024).toFixed(1)+' KB';
  document.getElementById('tickCount').textContent=engineTick;
}

// ═══════════════ 核心：记忆提炼与遗忘 ═══════════════
function consolidateMemories(npc){
  if(!npc.memories||npc.memories.length<3)return;
  if(engineTick%15!==0)return;
  if(!npc.abstractMemory)npc.abstractMemory=[];

  var recent=npc.memories.slice(0,10);
  var posCount=0,negCount=0,posEm=0,negEm=0;
  var subjects={};

  recent.forEach(function(m){
    if(m.em>0){posCount++;posEm+=m.em;}
    else{negCount++;negEm+=Math.abs(m.em);}
    var subMatch=m.text.match(/(.{2,6})(?:在|来|给|帮|打|偷|抢|说|骂|给|送|拿|做|干|找|丢)/);
    if(subMatch){var sub=subMatch[1];if(!subjects[sub])subjects[sub]={pos:0,neg:0,count:0};subjects[sub].count++;if(m.em>0)subjects[sub].pos++;else subjects[sub].neg++;}
  });

  var conclusions=[];
  if(posCount>negCount*2&&posCount>=3){
    conclusions.push({text:'最近运气不错，遇到不少好事',confidence:Math.min(90,posCount*15)});
  }else if(negCount>posCount*2&&negCount>=3){
    conclusions.push({text:'最近不太顺，心情有些低落',confidence:Math.min(90,negCount*15)});
  }
  for(var sub in subjects){
    var s=subjects[sub];
    if(s.count>=3){
      if(s.pos>s.neg*2){
        conclusions.push({text:sub+'是个好人，可以信任',confidence:Math.min(85,s.pos*20),subject:sub,valence:'positive'});
      }else if(s.neg>s.pos*2){
        conclusions.push({text:sub+'不太靠谱，得防着点',confidence:Math.min(85,s.neg*20),subject:sub,valence:'negative'});
      }
    }
  }

  conclusions.forEach(function(c){
    var existing=npc.abstractMemory.filter(function(a){return a.text===c.text;});
    if(existing.length>0){existing[0].confidence=Math.min(100,existing[0].confidence+5);existing[0].tick=engineTick;}
    else{npc.abstractMemory.push({text:c.text,confidence:c.confidence,subject:c.subject,valence:c.valence,tick:engineTick});}
  });

  // 抽象记忆衰减
  npc.abstractMemory.forEach(function(a){if(engineTick-a.tick>30)a.confidence=Math.max(0,a.confidence-3);});
  npc.abstractMemory=npc.abstractMemory.filter(function(a){return a.confidence>15;});
  if(npc.abstractMemory.length>10)npc.abstractMemory=npc.abstractMemory.slice(-10);

  // 清理原始记忆
  if(npc.memories.length>15){
    var keep=npc.memories.slice(0,8);
    npc.memories=keep.concat(npc.memories.slice(8).filter(function(m,i){return i%3===0;}));
    addLog('prune','🔪 遗忘','清理旧记忆：保留最近8条，旧的每3条保留1条（剩余'+npc.memories.length+'条）');
  }

  if(conclusions.length>0){
    addLog('consolidate','🧠 提炼','形成'+conclusions.length+'条抽象印象：'+conclusions.map(function(c){return c.text;}).join('；'));
  }
}

function injectEvent(){
  var input=document.getElementById('customEvent');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  injectEventCore(text,0,35);
}

function quickInject(idx){
  var p=presetEvents[idx];
  injectEventCore(p.text,p.pos,p.imp);
}

function injectEventCore(text,pos,imp){
  // 写入所有NPC的记忆（不同NPC不同情绪反应）
  NPCS.forEach(function(npc){
    var em=pos*(npc.personality.善良/100)*5;
    if(npc.name.indexOf(text.split(/在|帮|偷|打|说|骂|救|吵|欺负|表扬/)[0])>=0){
      em=pos*8; // 事件主角情绪更强
    }
    var mem={text:text,imp:imp,em:em,t:engineTick,tag:imp>50?'事件':'daily'};
    npc.memories.unshift(mem);
    if(npc.memories.length>20)npc.memories.length=20;
  });

  addLog('recall','📝 写入','事件「'+text+'」已写入5个NPC记忆');
  if(selectedNpc)renderFunnel();
  renderNPCList();
  updateStats();
}

// ═══════════════ 引擎Tick ═══════════════
function engineTickFn(){
  engineTick++;
  // 记忆提炼
  NPCS.forEach(function(npc){consolidateMemories(npc);});
  if(selectedNpc)renderFunnel();
  renderNPCList();
  updateStats();
}

// ═══════════════ 初始化 ═══════════════
function init(){
  renderNPCList();
  renderEventPresets();
  selectNPC('A');
  // 预注入一些种子记忆
  setTimeout(function(){injectEventCore('云溪在村口帮小翠赶走了野狗',1,55);},500);
  setTimeout(function(){injectEventCore('阿福偷了云溪的钱袋',-1,70);},1500);
  setTimeout(function(){injectEventCore('老村长帮阿福修好了铁匠铺的炉子',1,40);},2500);
  setTimeout(function(){injectEventCore('云溪在祠堂前救了摔倒的小翠',1,60);},3500);
  setTimeout(function(){injectEventCore('阿福说谎被老村长当众揭穿',-1,65);},4500);
  tickInterval=setInterval(engineTickFn,8000);
  addLog('recall','🚀 启动','记忆引擎启动，每8秒推进1 Tick，第15 Tick触发第一次提炼');
}
init();
</script>
</body>
</html>
