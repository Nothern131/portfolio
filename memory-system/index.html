<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>冷热记忆提炼 · 记忆漏斗</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0E14;color:#E8E6E3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
/* 顶部 */
.top-bar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#11151D;border-bottom:1px solid #1E2430}
.top-bar .logo{font-size:14px;color:#4ade80;font-weight:700}
.top-bar .hint{font-size:11px;color:#6B7280;margin-left:auto}
/* 主体三栏 */
.main{flex:1;display:flex;overflow:hidden}
/* 左：事件注入 */
.left-panel{width:340px;min-width:340px;background:#11151D;border-right:1px solid #1E2430;display:flex;flex-direction:column;overflow-y:auto;padding:16px}
.left-panel h3{font-size:12px;color:#6B7280;margin-bottom:12px;font-weight:600}
.event-btn{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #1E2430;background:#0B0E14;color:#E8E6E3;transition:all .2s}
.event-btn:hover{border-color:#4ade80;background:rgba(74,222,128,.04)}
.event-btn .tag{font-size:9px;padding:1px 5px;border-radius:3px;margin-right:6px}
.event-btn .tag.pos{background:rgba(74,222,128,.15);color:#4ade80}
.event-btn .tag.neg{background:rgba(248,113,113,.15);color:#f87171}
.action-btn{display:block;width:100%;padding:12px;margin-top:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-align:center}
.btn-inject{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.3)}
.btn-inject:hover{background:rgba(96,165,250,.25)}
.btn-consolidate{background:rgba(192,132,252,.15);color:#c084fc;border:1px solid rgba(192,132,252,.3)}
.btn-consolidate:hover{background:rgba(192,132,252,.25)}
.btn-forget{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.btn-forget:hover{background:rgba(248,113,113,.25)}
.btn-reset{background:rgba(255,168,77,.15);color:#ffa84d;border:1px solid rgba(255,168,77,.3)}
.btn-reset:hover{background:rgba(255,168,77,.25)}
/* 中：漏斗 */
.center-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.funnel-svg{width:100%;max-width:500px}
/* 右：数据面板 */
.right-panel{width:320px;min-width:320px;background:#11151D;border-left:1px solid #1E2430;display:flex;flex-direction:column;overflow-y:auto}
/* NPC对比 */
.npc-section{padding:14px 16px;border-bottom:1px solid #1E2430}
.npc-section h3{font-size:12px;color:#6B7280;margin-bottom:10px;font-weight:600}
.npc-section .subtitle{font-size:10px;color:#6B7280;margin-bottom:8px}
.npc-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px}
.npc-row .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.npc-row .name{width:55px;flex-shrink:0}
.npc-row .bar-wrap{flex:1;height:16px;background:#1E2430;border-radius:3px;overflow:hidden}
.npc-row .bar-fill{height:100%;border-radius:3px;transition:width .4s}
.npc-row .bar-fill.pos{background:#4ade80}
.npc-row .bar-fill.neg{background:#f87171}
.npc-row .val{width:36px;text-align:right;font-family:monospace;font-size:10px;flex-shrink:0}
/* 内存仪表 */
.mem-section{padding:14px 16px;border-bottom:1px solid #1E2430}
.mem-section h3{font-size:12px;color:#6B7280;margin-bottom:10px;font-weight:600}
.mem-big{font-size:36px;font-weight:700;color:#4ade80;font-family:monospace;margin-bottom:4px}
.mem-cap{font-size:10px;color:#6B7280;margin-bottom:8px}
.mem-bar-wrap{height:12px;background:#1E2430;border-radius:3px;overflow:hidden;margin-bottom:8px}
.mem-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.mem-bar-fill.safe{background:#4ade80}
.mem-bar-fill.warn{background:#f0b958}
.mem-bar-fill.danger{background:#f87171}
.mem-detail{font-size:10px;color:#6B7280;display:flex;gap:12px}
.mem-detail span{color:#E8E6E3;font-family:monospace}
/* 抽象印象 */
.abs-section{flex:1;padding:14px 16px;overflow-y:auto}
.abs-section h3{font-size:12px;color:#6B7280;margin-bottom:10px;font-weight:600}
.abs-card{background:#0B0E14;border:1px solid #1E2430;border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:all .4s}
.abs-card.positive{border-color:rgba(74,222,128,.3)}
.abs-card.negative{border-color:rgba(248,113,113,.3)}
.abs-card .card-title{font-size:12px;font-weight:600;margin-bottom:6px}
.abs-card .card-bar{height:4px;background:#1E2430;border-radius:2px;overflow:hidden}
.abs-card .card-fill{height:100%;border-radius:2px;transition:width .5s}
.abs-card .card-fill.pos{background:#4ade80}
.abs-card .card-fill.neg{background:#f87171}
.abs-card .card-meta{font-size:9px;color:#6B7280;margin-top:4px}
.empty{text-align:center;padding:20px;color:#3D4450;font-size:11px}
/* 动画 */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.highlight{animation:pulse .6s ease 3}
</style>
</head>
<body>
<div class="app">
<div class="top-bar">
  <div class="logo">记忆漏斗 v2</div>
  <span style="font-size:11px;color:#6B7280">Tick: <span id="tickDisplay" style="color:#4ade80;font-family:monospace">0</span></span>
  <span style="font-size:11px;color:#6B7280">| 事件数: <span id="evtCount" style="color:#E8E6E3;font-family:monospace">0</span></span>
  <div class="hint">点击左侧按钮注入事件 → 观察漏斗变化</div>
</div>
<div class="main">
  <!-- 左：事件按钮 -->
  <div class="left-panel">
    <h3>事件注入</h3>
    <div id="eventBtns"></div>
    <div style="margin-top:12px;border-top:1px solid #1E2430;padding-top:12px">
      <input type="text" id="customEvent" placeholder="自定义事件..." style="width:100%;background:#0B0E14;border:1px solid #1E2430;border-radius:6px;padding:8px 10px;font-size:11px;color:#E8E6E3;outline:none;margin-bottom:8px" onkeydown="if(event.key==='Enter')injectCustom()">
      <button class="action-btn btn-inject" onclick="injectCustom()">✚ 注入自定义事件</button>
    </div>
    <div style="margin-top:12px;border-top:1px solid #1E2430;padding-top:12px">
      <button class="action-btn btn-consolidate" onclick="triggerConsolidate()" id="btnConsolidate">🧠 触发记忆提炼</button>
      <button class="action-btn btn-forget" onclick="triggerForget()" id="btnForget">🔪 模拟遗忘清理</button>
      <button class="action-btn btn-reset" onclick="resetAll()">↺ 重置全部</button>
    </div>
  </div>

  <!-- 中：漏斗 -->
  <div class="center-panel">
    <svg class="funnel-svg" id="funnelSvg" viewBox="0 0 500 420"></svg>
  </div>

  <!-- 右：数据 -->
  <div class="right-panel">
    <div class="npc-section">
      <h3>同一事件 · 五人五感</h3>
      <div class="subtitle" id="lastEventTitle" style="color:#f0b958">点击左侧事件开始</div>
      <div id="npcCompare"></div>
    </div>
    <div class="mem-section">
      <h3>云溪 · 记忆占用</h3>
      <div class="mem-big" id="memBig">0.0 KB</div>
      <div class="mem-cap">上限 5KB | 未管理情况下可能达 50KB+</div>
      <div class="mem-bar-wrap"><div class="mem-bar-fill safe" id="memBar" style="width:0%"></div></div>
      <div class="mem-detail">
        原始 <span id="memRaw">0</span> 条 · 抽象 <span id="memAbs">0</span> 条
      </div>
    </div>
    <div class="abs-section">
      <h3>云溪 · 抽象印象</h3>
      <div id="absCards">
        <div class="empty">注入事件后点击"触发提炼"</div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
var NPCS=[
  {id:'A',name:'云溪',role:'侠客',avatar:'⚔',color:'#60a5fa',p:{正义:92,勇敢:85,沉默:75,贪婪:8,善良:78},memories:[],abstractMemory:[]},
  {id:'B',name:'阿福',role:'村民',avatar:'🍞',color:'#f0b958',p:{正义:45,勇敢:28,沉默:20,贪婪:68,善良:55},memories:[],abstractMemory:[]},
  {id:'C',name:'小翠',role:'少女',avatar:'🌸',color:'#4ade80',p:{正义:60,勇敢:35,沉默:45,贪婪:12,善良:88},memories:[],abstractMemory:[]},
  {id:'D',name:'老村长',role:'村长',avatar:'🏮',color:'#ffa84d',p:{正义:78,勇敢:55,沉默:50,贪婪:22,善良:72},memories:[],abstractMemory:[]},
  {id:'E',name:'书生',role:'书生',avatar:'📜',color:'#c084fc',p:{正义:55,勇敢:20,沉默:65,贪婪:15,善良:65},memories:[],abstractMemory:[]}
];
var engineTick=0;
var lastEvent=null;

var presetEvents=[
  {text:'阿福在村口偷了云溪的钱袋',pos:-1,imp:70},
  {text:'云溪在祠堂前救了摔倒的小翠',pos:1,imp:60},
  {text:'阿福说谎被老村长当众揭穿',pos:-1,imp:65},
  {text:'老村长在祠堂开会表扬了云溪',pos:1,imp:45},
  {text:'书生在河边帮云溪包扎伤口',pos:1,imp:50},
  {text:'云溪和阿福因为钱的事在井边大吵',pos:-1,imp:80},
  {text:'小翠在田埂上帮老村长收庄稼',pos:1,imp:30},
  {text:'阿福在茶馆对书生恶语相向',pos:-1,imp:50},
  {text:'书生在村口偷了老村长的酒',pos:-1,imp:55},
  {text:'老村长帮阿福修好了铁匠铺的炉子',pos:1,imp:40},
  {text:'阿福在村外欺负小翠',pos:-1,imp:75},
  {text:'小翠帮书生找到了丢失的书',pos:1,imp:35}
];

// ═══════════════ 渲染事件按钮 ═══════════════
function renderEventBtns(){
  var html='';
  presetEvents.forEach(function(ev,i){
    var tag=ev.pos>0?'<span class="tag pos">正面</span>':'<span class="tag neg">负面</span>';
    html+='<div class="event-btn" onclick="injectEvent('+i+')">'+tag+ev.text+'</div>';
  });
  document.getElementById('eventBtns').innerHTML=html;
}

// ═══════════════ 注入事件 ═══════════════
function injectEvent(idx){
  var ev=presetEvents[idx];
  injectCore(ev.text,ev.pos,ev.imp);
}

function injectCustom(){
  var input=document.getElementById('customEvent');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  injectCore(text,0,35);
}

function injectCore(text,pos,imp){
  lastEvent={text:text,pos:pos,imp:imp};
  engineTick++;
  NPCS.forEach(function(npc){
    var em=calcEmotion(npc,pos,text);
    npc.memories.unshift({text:text,imp:imp,em:em,t:engineTick});
    if(npc.memories.length>20)npc.memories.length=20;
  });
  document.getElementById('lastEventTitle').textContent='「'+text+'」';
  document.getElementById('lastEventTitle').classList.add('highlight');
  setTimeout(function(){document.getElementById('lastEventTitle').classList.remove('highlight');},2000);
  document.getElementById('evtCount').textContent=engineTick;
  document.getElementById('tickDisplay').textContent=engineTick;
  renderNPCCompare();
  drawFunnel();
  updateMemMeter();
}

// ═══════════════ 触发提炼 ═══════════════
function triggerConsolidate(){
  var npc=NPCS[0];
  if(npc.memories.length<3){alert('至少需要3条记忆才能提炼');return;}
  // 检查是否已经提炼过
  if(npc.abstractMemory.length>0){
    // 再次提炼：更新置信度
    engineTick+=15;
    NPCS.forEach(function(n){consolidateMemories(n);});
  }else{
    engineTick=15;
    NPCS.forEach(function(n){consolidateMemories(n);});
  }
  document.getElementById('tickDisplay').textContent=engineTick;
  drawFunnel();
  updateMemMeter();
  renderAbsCards();
  // 高亮按钮
  var btn=document.getElementById('btnConsolidate');
  btn.classList.add('highlight');
  setTimeout(function(){btn.classList.remove('highlight');},2000);
}

// ═══════════════ 触发遗忘 ═══════════════
function triggerForget(){
  var npc=NPCS[0];
  if(npc.memories.length<15){
    // 先快速注入事件到超过15条
    var fillers=[
      {text:'村口来了个陌生人',pos:0,imp:20},
      {text:'井边有人吵架',pos:0,imp:30},
      {text:'茶馆里在传闲话',pos:0,imp:25},
      {text:'祠堂前的灯笼被风吹灭了',pos:0,imp:15},
      {text:'田埂上发现一只死鸟',pos:0,imp:20},
      {text:'老槐树下有人丢了东西',pos:0,imp:30},
      {text:'河边有人洗衣服',pos:0,imp:10},
      {text:'村口的狗叫了一夜',pos:0,imp:20}
    ];
    var needed=16-npc.memories.length;
    fillers.slice(0,Math.max(needed,8)).forEach(function(f){
      engineTick++;
      NPCS.forEach(function(n){
        var em=f.pos*(n.p.善良/100)*5;
        n.memories.unshift({text:f.text,imp:f.imp,em:em,t:engineTick});
        if(n.memories.length>20)n.memories.length=20;
      });
    });
  }
  // 执行遗忘
  NPCS.forEach(function(npc){
    if(npc.memories.length>15){
      var keep=npc.memories.slice(0,8);
      npc.memories=keep.concat(npc.memories.slice(8).filter(function(m,i){return i%3===0;}));
    }
  });
  document.getElementById('tickDisplay').textContent=engineTick;
  drawFunnel();
  updateMemMeter();
  var btn=document.getElementById('btnForget');
  btn.classList.add('highlight');
  setTimeout(function(){btn.classList.remove('highlight');},2000);
}

// ═══════════════ 核心算法 ═══════════════
function calcEmotion(npc,pos,text){
  var em=pos*(npc.p.善良/100)*5;
  if(text&&npc.name.indexOf(text.split(/在|帮|偷|打|说|骂|救|吵|欺负|表扬/)[0])>=0)em=pos*8;
  return em;
}

function consolidateMemories(npc){
  if(!npc.memories||npc.memories.length<3)return;
  if(!npc.abstractMemory)npc.abstractMemory=[];
  var recent=npc.memories.slice(0,10);
  var posCount=0,negCount=0;
  var subjects={};
  recent.forEach(function(m){
    if(m.em>0)posCount++;else negCount++;
    var subMatch=m.text.match(/(.{2,6})(?:在|来|给|帮|打|偷|抢|说|骂|给|送|拿|做|干|找|丢)/);
    if(subMatch){var sub=subMatch[1];if(!subjects[sub])subjects[sub]={pos:0,neg:0,count:0};subjects[sub].count++;if(m.em>0)subjects[sub].pos++;else subjects[sub].neg++;}
  });
  var conclusions=[];
  if(posCount>negCount*2&&posCount>=3)conclusions.push({text:'最近运气不错，遇到不少好事',confidence:Math.min(90,posCount*15)});
  else if(negCount>posCount*2&&negCount>=3)conclusions.push({text:'最近不太顺，心情有些低落',confidence:Math.min(90,negCount*15)});
  for(var sub in subjects){
    var s=subjects[sub];
    if(s.count>=3){
      if(s.pos>s.neg*2)conclusions.push({text:sub+'是个好人，可以信任',confidence:Math.min(85,s.pos*20),subject:sub,valence:'positive'});
      else if(s.neg>s.pos*2)conclusions.push({text:sub+'不太靠谱，得防着点',confidence:Math.min(85,s.neg*20),subject:sub,valence:'negative'});
    }
  }
  conclusions.forEach(function(c){
    var existing=npc.abstractMemory.filter(function(a){return a.text===c.text;});
    if(existing.length>0){existing[0].confidence=Math.min(100,existing[0].confidence+5);existing[0].tick=engineTick;}
    else{npc.abstractMemory.push({text:c.text,confidence:c.confidence,subject:c.subject,valence:c.valence,tick:engineTick});}
  });
  npc.abstractMemory.forEach(function(a){if(engineTick-a.tick>30)a.confidence=Math.max(0,a.confidence-3);});
  npc.abstractMemory=npc.abstractMemory.filter(function(a){return a.confidence>15;});
  if(npc.abstractMemory.length>10)npc.abstractMemory=npc.abstractMemory.slice(-10);
}

// ═══════════════ 渲染 ═══════════════
function hexToRgb(hex){var r=parseInt(hex.slice(1,3),16);var g=parseInt(hex.slice(3,5),16);var b=parseInt(hex.slice(5,7),16);return r+','+g+','+b;}

function renderNPCCompare(){
  if(!lastEvent){
    document.getElementById('npcCompare').innerHTML='<div class="empty">点击左侧事件开始</div>';
    return;
  }
  var html='';
  NPCS.forEach(function(npc){
    var em=calcEmotion(npc,lastEvent.pos,lastEvent.text);
    var abs=Math.abs(em);
    var pct=Math.min(100,abs*12.5);
    var isPos=em>0;
    html+='<div class="npc-row">';
    html+='<div class="avatar" style="background:rgba('+hexToRgb(npc.color)+',.15)">'+npc.avatar+'</div>';
    html+='<div class="name">'+npc.name+'</div>';
    html+='<div class="bar-wrap"><div class="bar-fill '+(isPos?'pos':'neg')+'" style="width:'+pct+'%"></div></div>';
    html+='<div class="val" style="color:'+(isPos?'#4ade80':'#f87171')+'">'+(em>0?'+':'')+em.toFixed(1)+'</div>';
    html+='</div>';
  });
  document.getElementById('npcCompare').innerHTML=html;
}

function renderAbsCards(){
  var npc=NPCS[0];
  if(!npc.abstractMemory||npc.abstractMemory.length===0){
    document.getElementById('absCards').innerHTML='<div class="empty">注入事件后点击"触发提炼"</div>';
    return;
  }
  var html='';
  npc.abstractMemory.forEach(function(a){
    var cls=a.valence==='positive'?'positive':'negative';
    var icon=a.valence==='positive'?'✓':'⚠';
    html+='<div class="abs-card '+cls+'">';
    html+='<div class="card-title">'+icon+' '+a.text+'</div>';
    html+='<div class="card-bar"><div class="card-fill '+(a.valence==='positive'?'pos':'neg')+'" style="width:'+a.confidence+'%"></div></div>';
    html+='<div class="card-meta">置信度 '+a.confidence+'%'+(a.subject?' · 关于 '+a.subject:'')+'</div>';
    html+='</div>';
  });
  document.getElementById('absCards').innerHTML=html;
}

function updateMemMeter(){
  var npc=NPCS[0];
  var memBytes=npc.memories.length*200+npc.abstractMemory.length*100;
  var pct=Math.min(100,memBytes/5120*100);
  var bar=document.getElementById('memBar');
  bar.style.width=pct+'%';
  bar.className='mem-bar-fill '+(pct<60?'safe':pct<85?'warn':'danger');
  document.getElementById('memBig').textContent=(memBytes/1024).toFixed(1)+' KB';
  document.getElementById('memRaw').textContent=npc.memories.length;
  document.getElementById('memAbs').textContent=npc.abstractMemory.length;
}

function drawFunnel(){
  var svg=document.getElementById('funnelSvg');
  var npc=NPCS[0];
  var mc=npc.memories.length;
  var ac=npc.abstractMemory.length;

  var h='';
  // 第1层：原始记忆
  var w1=400,h1=85,x1=50,y1=20;
  h+='<rect x="'+x1+'" y="'+y1+'" width="'+w1+'" height="'+h1+'" rx="8" fill="rgba(74,222,128,.03)" stroke="rgba(74,222,128,.2)" stroke-width="1"/>';
  h+='<text x="'+x1+'" y="'+y1+'" dy="-6" fill="#4ade80" font-size="11" font-weight="600" font-family="sans-serif">原始记忆</text>';
  h+='<text x="'+(x1+w1)+'" y="'+y1+'" dy="-6" fill="#4ade80" font-size="14" font-weight="700" font-family="monospace" text-anchor="end">'+mc+'</text>';

  if(mc>0){
    var shown=npc.memories.slice().reverse().slice(0,6);
    shown.forEach(function(m,i){
      var y=y1+14+i*11;
      var isPos=m.em>0;
      var fillW=Math.max(20,(w1-24)*Math.min(1,Math.abs(m.em)/8));
      h+='<rect x="'+(x1+12)+'" y="'+y+'" width="'+fillW+'" height="9" rx="2" fill="'+(isPos?'rgba(74,222,128,.2)':'rgba(248,113,113,.2)')+'"/>';
      h+='<text x="'+(x1+16)+'" y="'+y+'" dy="9" fill="'+(isPos?'#4ade80':'#f87171')+'" font-size="8" font-family="sans-serif">'+m.text.slice(0,22)+'</text>';
    });
    if(mc>6)h+='<text x="250" y="'+(y1+14+6*11+10)+'" fill="#6B7280" font-size="8" font-family="sans-serif" text-anchor="middle">…还有'+(mc-6)+'条</text>';
  }else{
    h+='<text x="250" y="'+(y1+h1/2+4)+'" fill="#3D4450" font-size="11" font-family="sans-serif" text-anchor="middle">点击左侧事件注入记忆</text>';
  }

  // 漏斗壁1
  var w2=300,h2=75,x2=100,y2=125;
  h+='<polygon points="'+(x1+30)+','+(y1+h1)+' '+(x1+w1-30)+','+(y1+h1)+' '+(x2+20)+','+y2+' '+(x2+w2-20)+','+y2+'" fill="none" stroke="#1E2430" stroke-width="1"/>';
  h+='<text x="250" y="'+(y1+h1+22)+'" fill="#3D4450" font-size="9" font-family="sans-serif" text-anchor="middle">▼ 提炼：按主语分组，情感统计，生成抽象结论 ▼</text>';

  // 第2层：抽象印象
  h+='<rect x="'+x2+'" y="'+y2+'" width="'+w2+'" height="'+h2+'" rx="8" fill="rgba(192,132,252,.03)" stroke="rgba(192,132,252,.2)" stroke-width="1"/>';
  h+='<text x="'+x2+'" y="'+y2+'" dy="-6" fill="#c084fc" font-size="11" font-weight="600" font-family="sans-serif">抽象印象</text>';
  h+='<text x="'+(x2+w2)+'" y="'+y2+'" dy="-6" fill="#c084fc" font-size="14" font-weight="700" font-family="monospace" text-anchor="end">'+ac+'</text>';

  if(ac>0){
    var absShown=npc.abstractMemory.slice(0,3);
    absShown.forEach(function(a,i){
      var y=y2+14+i*18;
      var isPos=a.valence==='positive';
      h+='<rect x="'+(x2+12)+'" y="'+y+'" width="'+(w2-24)*a.confidence/100+'" height="14" rx="3" fill="'+(isPos?'rgba(74,222,128,.2)':'rgba(248,113,113,.2)')+'"/>';
      h+='<text x="'+(x2+16)+'" y="'+y+'" dy="12" fill="'+(isPos?'#4ade80':'#f87171')+'" font-size="10" font-family="sans-serif">'+(isPos?'✓':'⚠')+' '+a.text+' · '+a.confidence+'%</text>';
    });
  }else{
    h+='<text x="250" y="'+(y2+h2/2+4)+'" fill="#3D4450" font-size="11" font-family="sans-serif" text-anchor="middle">注入事件后点击"触发提炼"</text>';
  }

  // 漏斗壁2
  var w3=200,h3=65,x3=150,y3=220;
  h+='<polygon points="'+(x2+30)+','+(y2+h2)+' '+(x2+w2-30)+','+(y2+h2)+' '+(x3+20)+','+y3+' '+(x3+w3-20)+','+y3+'" fill="none" stroke="#1E2430" stroke-width="1"/>';
  h+='<text x="250" y="'+(y2+h2+22)+'" fill="#3D4450" font-size="9" font-family="sans-serif" text-anchor="middle">▼ 记忆驱动行为 ▼</text>';

  // 第3层：记忆驱动
  h+='<rect x="'+x3+'" y="'+y3+'" width="'+w3+'" height="'+h3+'" rx="8" fill="rgba(255,168,77,.03)" stroke="rgba(255,168,77,.2)" stroke-width="1"/>';
  h+='<text x="'+x3+'" y="'+y3+'" dy="-6" fill="#ffa84d" font-size="11" font-weight="600" font-family="sans-serif">记忆驱动</text>';

  var hasDrive=false;
  if(npc.memories.length>0){
    var recent=npc.memories.filter(function(m){return m.imp>40&&(engineTick-m.t)<=10;});
    if(recent.length>0){
      hasDrive=true;
      h+='<text x="'+(x3+12)+'" y="'+(y3+18)+'" fill="#ffa84d" font-size="10" font-family="sans-serif">'+npc.name+'还在想着…</text>';
      h+='<text x="'+(x3+12)+'" y="'+(y3+36)+'" fill="#6B7280" font-size="9" font-family="sans-serif">'+recent[0].text.slice(0,18)+'…</text>';
    }
  }
  if(!hasDrive){
    h+='<text x="250" y="'+(y3+h3/2+4)+'" fill="#3D4450" font-size="11" font-family="sans-serif" text-anchor="middle">注入高影响力事件</text>';
  }

  svg.innerHTML=h;
}

function resetAll(){
  engineTick=0;
  lastEvent=null;
  NPCS.forEach(function(n){n.memories=[];n.abstractMemory=[];});
  document.getElementById('tickDisplay').textContent='0';
  document.getElementById('evtCount').textContent='0';
  document.getElementById('lastEventTitle').textContent='点击左侧事件开始';
  document.getElementById('npcCompare').innerHTML='<div class="empty">点击左侧事件开始</div>';
  document.getElementById('absCards').innerHTML='<div class="empty">注入事件后点击"触发提炼"</div>';
  drawFunnel();
  updateMemMeter();
}

// ═══════════════ 初始化 ═══════════════
renderEventBtns();
drawFunnel();
updateMemMeter();
document.getElementById('npcCompare').innerHTML='<div class="empty">点击左侧事件开始</div>';
</script>
</body>
</html>
